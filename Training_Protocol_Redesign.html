<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<title>Protocol v2 — Full Separation</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Palette: iron + chalk. Four accents, each carrying meaning:
     load   = resistance work
     aero   = conditioning work
     tendon = HSR / knee track
     halt   = stop rules
   Type thesis: prescriptions are monospaced data; reasoning is prose.
   ============================================================ */
:root{
  --ink:#0e1116;
  --slab:#171c24;
  --slab-hi:#1f2630;
  --line:#2a323f;
  --line-soft:#212936;
  --bone:#e9e7e2;
  --ash:#8a94a4;
  --ash-dim:#5f6878;

  --load:#f0a43a;
  --load-bg:#2b1f0c;
  --aero:#48b6cf;
  --aero-bg:#0c242b;
  --tendon:#a98bd6;
  --tendon-bg:#1e1630;
  --halt:#e0645f;
  --halt-bg:#2b1414;
  --ok:#5cc08e;

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --r:10px;
  --pad:16px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
::selection{background:var(--load);color:#000}
:focus-visible{outline:2px solid var(--aero);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}
.view{display:none;padding-top:14px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- masthead ---------- */
.mast{
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(180deg,#12161d,var(--ink));
}
.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ash-dim);
}
.mast h1{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.02em;
  margin-top:3px;
  line-height:1.15;
}
.mast .sub{font-size:12.5px;color:var(--ash);margin-top:5px}
.rule-line{
  font-family:var(--mono);
  font-size:11px;
  color:var(--load);
  margin-top:9px;
  letter-spacing:.02em;
  border-left:2px solid var(--load);
  padding-left:9px;
}

/* ============================================================
   SIGNATURE — THE TWO-LANE WEEK
   Resistance rides the upper rail. Conditioning rides the lower.
   The gap between them is the entire point of this redesign.
   ============================================================ */
.rail{
  position:relative;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin:18px 0 8px;
  padding:6px 0 8px;
}
.rail::before{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);
}
.col{
  position:relative;
  display:grid;
  grid-template-rows:52px 20px 52px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.col .dow{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.08em;
  color:var(--ash-dim);
  background:var(--ink);
  padding:0 3px;
  z-index:2;
}
.chip{
  overflow:hidden;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--slab);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:4px 2px;
  transition:transform .14s ease,border-color .14s ease;
}
.col:active .chip{transform:scale(.95)}
.chip .ct{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.chip .cs{font-size:8px;color:var(--ash-dim);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.chip.top{grid-row:1}
.chip.bot{grid-row:3}
.chip.load{border-color:#4a3413;background:var(--load-bg)}
.chip.load .ct{color:var(--load)}
.chip.aero{border-color:#123540;background:var(--aero-bg)}
.chip.aero .ct{color:var(--aero)}
.chip.rest{grid-row:1/4;align-self:center;height:52px;border-style:dashed;background:transparent}
.chip.rest .ct{color:var(--ash-dim)}
.col.sel .chip{border-color:var(--bone)}
.col.sel .chip.load{box-shadow:0 0 0 1px var(--load) inset}
.col.sel .chip.aero{box-shadow:0 0 0 1px var(--aero) inset}
.tdot{
  position:absolute;
  bottom:-3px;left:50%;
  transform:translateX(-50%);
  width:5px;height:5px;
  border-radius:50%;
  background:var(--tendon);
}
.rail-key{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.05em;
  color:var(--ash-dim);
  text-transform:uppercase;
  padding-bottom:16px;
  border-bottom:1px solid var(--line-soft);
}
.rail-key i{
  display:inline-block;
  width:7px;height:7px;
  border-radius:2px;
  margin-right:5px;
  vertical-align:middle;
}

/* ---------- generic blocks ---------- */
h2{
  font-size:12px;
  font-family:var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ash);
  margin:26px 0 10px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line-soft);
}
h2:first-of-type{margin-top:18px}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:5px}
p{font-size:14px;color:#c6c9d0;margin-bottom:10px}
p.tight{margin-bottom:6px}
strong{color:var(--bone);font-weight:650}
.small{font-size:12.5px;color:var(--ash)}

.card{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px 15px;
  margin-bottom:9px;
}
.card.flat{background:transparent}

.note{
  border-left:2px solid var(--line);
  padding:11px 13px;
  border-radius:0 var(--r) var(--r) 0;
  background:var(--slab);
  margin-bottom:10px;
}
.note .nt{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:5px;
}
.note p{font-size:13px;margin-bottom:0;color:#bcc0c9}
.note p + p{margin-top:7px}
.note.load{border-color:var(--load);background:var(--load-bg)}
.note.load .nt{color:var(--load)}
.note.aero{border-color:var(--aero);background:var(--aero-bg)}
.note.aero .nt{color:var(--aero)}
.note.tendon{border-color:var(--tendon);background:var(--tendon-bg)}
.note.tendon .nt{color:var(--tendon)}
.note.halt{border-color:var(--halt);background:var(--halt-bg)}
.note.halt .nt{color:var(--halt)}

/* ---------- exercise cards ---------- */
.ex{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:7px;
  overflow:hidden;
}
.ex.hsr{border-left:2px solid var(--tendon)}
.ex.opt{border-style:dashed}
.ex-h{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.ex-h:active{background:var(--slab-hi)}
.ex-n{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ash-dim);
  min-width:16px;
  padding-top:2px;
}
.ex-b{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;letter-spacing:-.005em}
.ex-dose{
  font-family:var(--mono);
  font-size:12px;
  color:var(--load);
  margin-top:2px;
  letter-spacing:.01em;
}
.ex.hsr .ex-dose{color:var(--tendon)}
.ex-car{color:var(--ash-dim);font-size:11px;transition:transform .2s}
.ex.open .ex-car{transform:rotate(90deg)}
.ex-d{display:none;padding:0 14px 14px;border-top:1px solid var(--line-soft)}
.ex.open .ex-d{display:block}

.spec{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(72px,1fr));
  gap:6px;
  margin:12px 0 11px;
}
.spec div{
  background:var(--ink);
  border:1px solid var(--line-soft);
  border-radius:6px;
  padding:6px 8px;
}
.spec .k{
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
}
.spec .v{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:2px}
.why{font-size:12.5px;color:var(--ash);line-height:1.5}
.why b{color:#c9ccd4;font-weight:600}

.sets{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.sets .lbl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
  margin-right:2px;
}
.tick{
  width:30px;height:30px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--ink);
  color:var(--ash-dim);
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
  transition:all .12s;
}
.tick.done{background:var(--load);border-color:var(--load);color:#000;font-weight:700}
.ex.hsr .tick.done{background:var(--tendon);border-color:var(--tendon)}

/* ---------- tools ---------- */
.tool{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:15px;
  margin-bottom:10px;
}
.tool-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tool-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.tool-hint{font-size:11px;color:var(--ash-dim)}
.readout{
  font-family:var(--mono);
  font-size:42px;
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.phase{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-top:6px;
  color:var(--ash);
}
.bar{height:4px;background:var(--ink);border-radius:2px;margin:13px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--load);border-radius:2px}
.bar i.aero{background:var(--aero)}
.bar i.tendon{background:var(--tendon)}
.btns{display:flex;gap:7px}
button.b{
  flex:1;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--slab-hi);
  color:var(--bone);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button.b:active{transform:scale(.97)}
button.b.go{background:var(--load);border-color:var(--load);color:#000;font-weight:700}
button.b.go.aero{background:var(--aero);border-color:var(--aero)}
button.b.go.tendon{background:var(--tendon);border-color:var(--tendon)}

/* tempo pacer */
.pacer{height:52px;background:var(--ink);border-radius:8px;position:relative;overflow:hidden;margin-bottom:12px;border:1px solid var(--line-soft)}
.pacer i{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--tendon);box-shadow:0 0 12px var(--tendon)}
.pacer span{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);
}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.tbl th{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
  text-align:left;
  padding:7px 8px;
  border-bottom:1px solid var(--line);
  font-weight:500;
}
.tbl td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl td.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}

/* volume bars */
.vol{margin-bottom:9px}
.vol-t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.vol-t span:last-child{font-family:var(--mono);color:var(--ash);font-size:11.5px}
.vol-b{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--line-soft)}
.vol-b i{display:block;height:100%;border-radius:3px;background:var(--ash-dim)}
.vol-b i.pri{background:var(--load)}
.vol-b i.reh{background:var(--tendon)}
.vol-b u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line);text-decoration:none}

/* verdict pills */
.vd{
  display:inline-block;
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.08em;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap;
  text-transform:uppercase;
}
.vd.s{background:#123021;color:var(--ok)}
.vd.p{background:var(--load-bg);color:var(--load)}
.vd.c{background:var(--halt-bg);color:var(--halt)}
.vd.u{background:var(--tendon-bg);color:var(--tendon)}

/* knee log */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:12px 0}
.scale button{
  aspect-ratio:1;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--ink);
  color:var(--ash);
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
}
.scale button.on{background:var(--bone);color:#000;border-color:var(--bone);font-weight:700}
.scale button.hi{border-color:var(--halt);color:var(--halt)}
.scale button.hi.on{background:var(--halt);color:#000;border-color:var(--halt)}
.verdict{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.03em;
  padding:11px 13px;
  border-radius:8px;
  margin-top:11px;
  line-height:1.5;
}
.verdict.go{background:#12291d;color:var(--ok);border:1px solid #1e4030}
.verdict.hold{background:var(--load-bg);color:var(--load);border:1px solid #4a3413}
.verdict.drop{background:var(--halt-bg);color:var(--halt);border:1px solid #4a1f1f}

/* citations */
.cite{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ash-dim);
  line-height:1.6;
  padding:9px 0;
  border-bottom:1px solid var(--line-soft);
}
.cite b{color:var(--ash);font-weight:500}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(14,17,22,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
nav button{
  flex:1;
  background:none;
  border:none;
  padding:11px 2px 12px;
  color:var(--ash-dim);
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  border-top:2px solid transparent;
  margin-top:-1px;
}
nav button.on{color:var(--bone);border-top-color:var(--load)}
nav button .ic{display:block;font-size:15px;margin-bottom:3px;line-height:1}

.foot{
  font-size:11px;
  color:var(--ash-dim);
  line-height:1.6;
  padding:24px 0 10px;
  border-top:1px solid var(--line-soft);
  margin-top:28px;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:360px){
  .chip .ct{font-size:10.5px}
  .chip .cs{display:none}
  .col{grid-template-rows:46px 18px 46px}
}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="eyebrow">Protocol v2 · verified Aug 2026</div>
    <h1>Full Separation Build</h1>
    <div class="sub">39M · TRT · bilateral knee tendon rehab · strength, hypertrophy, longevity</div>
    <div class="rule-line">Every day is EITHER resistance OR conditioning. Never both.</div>
  </div>
</header>

<main class="wrap">
  <section id="v-week" class="view on"></section>
  <section id="v-train" class="view"></section>
  <section id="v-knee" class="view"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-eviq" class="view"></section>
  <div class="foot" id="foot"></div>
</main>

<nav>
  <button data-v="week" class="on"><span class="ic">▤</span>Week</button>
  <button data-v="train"><span class="ic">▲</span>Train</button>
  <button data-v="knee"><span class="ic">◈</span>Knee</button>
  <button data-v="plan"><span class="ic">⟶</span>Plan</button>
  <button data-v="eviq"><span class="ic">§</span>Evidence</button>
</nav>

<script>
/* ============================================================
   STORAGE — artifact storage when available, memory otherwise.
   Never throws; the app works fully without persistence.
   ============================================================ */
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r ? JSON.parse(r.value) : (mem[k]??null); } }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,JSON.stringify(v),false); } }catch(e){}
  }
};
let state = { ticks:{}, knee:[], week:1 };

/* ============================================================
   THE WEEK — two lanes. Resistance rides top, conditioning bottom.
   ============================================================ */
const WEEK = [
  {d:"MON", lane:"top", key:"lowerA", t:"LO A", full:"Lower A", s:"quad", tendon:true,
   why:"Heaviest tendon session lands on the freshest tissue, straight off the rest day."},
  {d:"TUE", lane:"top", key:"upperA", t:"UP A", full:"Upper A", s:"horiz",
   why:"Legs offloaded the day after heavy knee work. No aerobic stress anywhere near it."},
  {d:"WED", lane:"bot", key:"zone2", t:"Z2", full:"Zone 2", s:"45–60m",
   why:"Lowest-cost aerobic block, doubling as active recovery between the two lower days."},
  {d:"THU", lane:"top", key:"lowerB", t:"LO B", full:"Lower B", s:"hip", tendon:true,
   why:"72 h after Lower A — full recovery of the knee extensor mechanism."},
  {d:"FRI", lane:"top", key:"upperB", t:"UP B", full:"Upper B", s:"vert",
   why:"72 h after Upper A. Legs rest ahead of Saturday's intervals."},
  {d:"SAT", lane:"bot", key:"vo2", t:"4×4", full:"Norwegian 4×4", s:"or Z2",
   why:"~48 h clear of the last heavy lower session — double the ≥24 h minimum."},
  {d:"SUN", lane:"rest", key:"rest", t:"REST", full:"Rest", s:"",
   why:"One genuine off day, positioned to precede the heaviest tendon session."}
];

/* ============================================================
   SESSIONS
   dose fields drive both the UI and the weekly volume computation.
   m = muscles credited: [name, directSets] ; i = indirect (counted 0.5)
   ============================================================ */
const S = {
lowerA:{
  name:"Lower A", tag:"Quad / knee focus + primary tendon load", lane:"top", day:"MON",
  head:"The tendon session. Everything here either loads the patellar tendon directly or supports the joint that carries it.",
  ex:[
   {n:"Spanish squat isometric", dose:"5 × 45 s @ ~70% MVIC", sets:5, opt:true,
    rir:"—", rest:"2 min", tempo:"hold",
    why:"<b>Optional.</b> Analgesia and potentiation. Skip it if it leaves you fatigued for the hack squat — it is a tool, not a stage.", m:[], i:[["Quadriceps",2]]},
   {n:"Hack squat or pendulum squat", dose:"4 × 6–10", sets:4, hsr:true,
    rir:"2–3", rest:"3 min", tempo:"3 s / 3 s",
    why:"<b>Primary patellar tendon loader.</b> Upright torso, minimal spinal load, controlled deep flexion. This is the movement the 12-week 15RM→6RM track runs on.", m:[["Quadriceps",4]], i:[["Glutes",4]]},
   {n:"Leg press", dose:"3 × 10–12", sets:3,
    rir:"1–2", rest:"2–3 min", tempo:"2 / 1 / 2",
    why:"Quad volume at low knee shear. Also the vehicle for the single-leg 150% bodyweight test that gates plyometrics.", m:[["Quadriceps",3]], i:[["Glutes",3]]},
   {n:"Seated leg extension — long length", dose:"3 × 12–15", sets:3, hsr:true,
    rir:"1", rest:"2 min", tempo:"3 s / 3 s",
    why:"Isolated knee-extensor and patellar tendon load at long muscle length. Long-length selection is supported (ES 0.283); lengthened <i>partials</i> are not required.", m:[["Quadriceps",3]], i:[]},

/* ============================================================
   VOLUME — computed from the sessions above, not asserted
   ============================================================ */
function volume(){
  const tot={}, freq={};
  Object.entries(S).forEach(([k,ses])=>{
    const seen=new Set();
    ses.ex.forEach(e=>{
      (e.m||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n; seen.add(mu); });
      (e.i||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n*0.5; seen.add(mu); });
    });
    seen.forEach(mu=>freq[mu]=(freq[mu]||0)+1);
  });
  return Object.entries(tot)
    .map(([mu,v])=>({mu, v:Math.round(v*10)/10, f:freq[mu]}))
    .sort((a,b)=>b.v-a.v);
}

async function tick(id,s,el){
  const a = state.ticks[id]||[];
  const idx = a.indexOf(s);
  if(idx>=0) a.splice(idx,1); else a.push(s);
  state.ticks[id]=a;
  el.classList.toggle("done");
  await store.set("ticks",state.ticks);
}

function tempoTool(){return `<div class="tool">

  <p class="small" style="margin:11px 0 0">Three seconds up, three seconds down. Load the bar so the last rep of the set still holds the tempo — if the tempo breaks, the set ended two reps ago.</p></div>`;}

function holdTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">Isometric hold · 5 × 45 s</span><span class="tool-hint">Spanish squat, optional</span></div>

function intervalTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">4×4 interval timer</span><span class="tool-hint">~38 min total</span></div>

function restTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">Rest timer</span><span class="tool-hint">tap to set</span></div>
  <div class="readout" id="rsR">3:00</div><div class="phase" id="rsP">ready</div>
  <div class="bar"><i id="rsB"></i></div>
  <div class="btns" style="margin-bottom:7px">
    <button class="b" onclick="setRest(60)">60 s</button>
    <button class="b" onclick="setRest(90)">90 s</button>
    <button class="b" onclick="setRest(120)">2 min</button>

  </div>
  <div class="btns"><button class="b go" id="rsgo" onclick="toggleTimer('rs')">Start</button><button class="b" onclick="resetTimer('rs')">Reset</button></div></div>`;}

const IV_PHASES = [["Warm-up",600],["Interval 1",240],["Recovery",180],["Interval 2",240],["Recovery",180],["Interval 3",240],["Recovery",180],["Interval 4",240],["Cool-down",300]];
const HD_PHASES = [["Hold 1",45],["Rest",120],["Hold 2",45],["Rest",120],["Hold 3",45],["Rest",120],["Hold 4",45],["Rest",120],["Hold 5",45]];
const T = {
  iv:{ph:IV_PHASES,i:0,left:600,on:false,r:"ivR",p:"ivP",b:"ivB",g:"ivgo"},
  hd:{ph:HD_PHASES,i:0,left:45,on:false,r:"hdR",p:"hdP",b:"hdB",g:"hdgo"},
  rs:{ph:[["Rest",180]],i:0,left:180,on:false,r:"rsR",p:"rsP",b:"rsB",g:"rsgo"}
};
function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return m>0?m+":"+String(x).padStart(2,"0"):String(x);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function paint(k){
  const t=T[k], r=document.getElementById(t.r); if(!r) return;
  const [nm,dur]=t.ph[t.i];
  r.textContent=fmt(Math.ceil(t.left));
  const total=t.ph.length;
  document.getElementById(t.p).textContent = k==="hd"
    ? `${nm} · ${Math.floor(t.i/2)+1} of 5`
    : (total>1 ? `${nm} · ${t.i+1} of ${total}` : nm);
  document.getElementById(t.b).style.width = ((dur-t.left)/dur*100)+"%";
  const g=document.getElementById(t.g); if(g) g.textContent = t.on?"Pause":"Start";
}
function toggleTimer(k){ T[k].on=!T[k].on; paint(k); }
function resetTimer(k){ const t=T[k]; t.on=false; t.i=0; t.left=t.ph[0][1]; paint(k); }
function setRest(s){ T.rs.ph=[["Rest",s]]; resetTimer("rs"); }
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  Object.keys(T).forEach(k=>{
    const t=T[k]; if(!t.on) return;
    if(!document.getElementById(t.r)) return;
    t.left-=dt;
    if(t.left<=0){
      if(t.i<t.ph.length-1){ t.i++; t.left=t.ph[t.i][1]; buzz([90,60,90]); }
      else { t.on=false; t.left=0; buzz([200,80,200,80,200]); }
    }
    paint(k);
  });
  // tempo pacer
  if(PC.on){
    PC.t+=dt; const cyc=PC.t%6, up=cyc<3;
    const bar=document.getElementById("pcb"), lab=document.getElementById("pct");
    if(bar){
      bar.style.left = (up? cyc/3 : (1-(cyc-3)/3))*98 + "%";
      lab.textContent = (up?"UP  ":"DOWN  ") + (up?Math.ceil(3-cyc):Math.ceil(3-(cyc-3)));
      if(Math.floor(PC.t/3)!==PC.half){ PC.half=Math.floor(PC.t/3); buzz(35); }
    }
  }
  requestAnimationFrame(loop);
}

   ============================================================ */
const DX = [
 ["Patellar tendinopathy","Localised at the <b>inferior</b> pole of the patella. Loads up with jumping, squatting, decline. Warms up, then returns after. Dose-dependent.","<b>Programme as written.</b> HSR is the core."],
 ["Quadriceps tendinopathy","Pain at the <b>superior</b> pole of the patella.","Same HSR logic, different palpation point. Broadly compatible."],
 ["Patellofemoral pain","Diffuse, retropatellar or peripatellar. Worse on stairs, hills, prolonged sitting.","Reduce deep-flexion loading early. <b>Increase</b> hip abductor and quad work. The deep hack squat may need range limits."],
 ["Fat pad impingement","<b>Below</b> the patella. Worse with hyperextension and prolonged standing.","Avoid terminal extension and lockout. Leg extension may need range restriction."],
 ["Early tibiofemoral OA","Morning stiffness, crepitus, joint-line pain, swelling after volume.","Volume and frequency become the tuning variables rather than load. Different progression logic entirely."]
];
function renderKnee(){
  const log = state.knee.slice(-14);
  const recent = log.slice(-3).map(x=>x.v);
  let vc="go", vt="Progress as scheduled. Tolerance is holding.";
  if(recent.length && recent[recent.length-1]>3){ vc="drop"; vt="Above 3/10. Drop the tendon load one tier at the next session. Do not push through."; }
  else if(recent.length>=2 && recent[recent.length-1]>=recent[recent.length-2] && recent[recent.length-1]>2){ vc="hold"; vt="Not trending down. Hold the current tier rather than advancing."; }
  else if(!recent.length){ vc="hold"; vt="No entries yet. Log the morning after every lower day."; }

  $("#v-knee").innerHTML = `
  <div class="note halt"><div class="nt">Before week 1 — confirm the diagnosis</div>
    <p>This programme is built for <strong>patellar tendinopathy</strong>. Your brief specifies "bilateral knee rehabilitation" without naming a diagnosis, and the loading prescription genuinely differs across the plausible alternatives. A physiotherapist or sports physician can settle this in one appointment. If you are 39, bilateral, and it came on gradually under load, patellar tendinopathy is a reasonable prior — but a reasonable prior is not a diagnosis.</p></div>
  <div class="scroll"><table class="tbl"><tr><th>If it is</th><th>Pattern</th><th>What changes</th></tr>
    ${DX.map(d=>`<tr><td><strong>${d[0]}</strong></td><td class="small">${d[1]}</td><td class="small">${d[2]}</td></tr>`).join("")}
  </table></div>

  <h2>The 24-hour rule</h2>
  <div class="note tendon"><div class="nt">This outranks everything else in the programme</div>
    <p>Pain <strong>≤3/10 during loading is acceptable</strong> — tendon rehab is not meant to be pain-free. What matters is that it <strong>returns to baseline within 24 hours</strong>.</p>
    <p>It outranks the progression table, the RIR targets and your own impatience. It is the only real feedback signal a tendon gives you.</p></div>

  <div class="card">
    <h3>Morning-after test</h3>
    <p class="small">Single-leg decline squat, 25° board, to about 60° knee flexion. Same setup, same time of day, every morning after a lower day.</p>
    <div class="scale">${Array.from({length:11},(_,i)=>`<button class="${i>3?'hi':''}" onclick="logKnee(${i})">${i}</button>`).join("")}</div>
    <div class="verdict ${vc}">${vt}</div>
    ${log.length?`<p class="small" style="margin-top:12px">Recent — ${log.map(x=>x.v).join(" · ")}</p>`:""}
  </div>

  <h2>The core — Heavy Slow Resistance</h2>
  <div class="card"><table class="tbl">
    <tr><th>Day</th><th>Movement</th><th>Prescription</th></tr>
    <tr><td class="m">Lower A</td><td>Hack / pendulum squat</td><td class="m" style="color:var(--tendon)">4 × 6–10 · 3s/3s</td></tr>
    <tr><td class="m">Lower A</td><td>Leg extension, long length</td><td class="m" style="color:var(--tendon)">3 × 12–15 · 3s/3s</td></tr>
    <tr><td class="m">Lower B</td><td>Leg extension</td><td class="m" style="color:var(--tendon)">3 × 10–12 · 3s/3s</td></tr>
  </table>
  <p class="small" style="margin:10px 0 0">That is the entire tendon programme — two sessions per week, heavy, slow, progressive, embedded in the lifting days rather than run as a separate injury block. Everything else on the lower days supports it.</p></div>

  <div class="note"><div class="nt" style="color:var(--tendon)">Why HSR, honestly</div>
    <p>Never beaten by any other exercise intervention in the 2026 network meta-analysis of 17 RCTs, and in Kongsgaard 2009 it matched eccentric training on pain and function at 12 weeks while producing superior collagen turnover, reduced neovascularisation and higher 6-month satisfaction. It also has the practical advantage of <em>being</em> strength training, so it does not compete with your other goals for time or recovery.</p>
    <p><strong>The part usually left out:</strong> in that same trial, tendon mechanical properties were unaffected by treatment. Twelve weeks of HSR improved symptoms and turnover without measurably changing tendon mechanics. Symptom improvement is not the same as structural repair.</p></div>

  <h2>Isometrics — optional, honestly framed</h2>
  <div class="card">
    <p class="small"><strong>Spanish squat: 5 × 45 s at ~70% MVIC, 2 min rest.</strong> Band anchored behind the knees, torso upright. Done properly this reaches roughly 70% MVIC where a wall sit typically reaches ~60% — that is what makes it a real patellar tendon loader rather than just a burn.</p>
    <p class="small">The dosing is correctly transcribed from Rio 2015. The <em>rationale</em> is weaker than it is usually presented: <strong>n = 6</strong>, and Clifford 2020 (10 studies) found isometric exercise was not superior to isotonic at any timepoint up to 12 weeks.</p>
    <p class="small" style="margin-bottom:0"><strong>Run it as a personal experiment, not a mandate.</strong> Try it before Lower A for two weeks. If the hack squat feels better afterwards, keep it. If it just makes your quads tired, move it to the end or drop it. Either decision is evidence-consistent.</p></div>

  <h2>Supporting structures</h2>
  <div class="card"><table class="tbl">
    <tr><td>Glute medius · frontal-plane hip control</td><td class="m">2×/wk</td></tr>
    <tr><td>Adductors · Copenhagen</td><td class="m">1–2×/wk</td></tr>
    <tr><td>Hamstrings · seated curl + Nordic</td><td class="m">2×/wk</td></tr>
    <tr><td>Tibialis anterior</td><td class="m">2×/wk</td></tr>
    <tr><td>Gastrocnemius / soleus</td><td class="m">2×/wk each</td></tr>
    <tr><td>Single-leg control · split squat, carries</td><td class="m">2×/wk</td></tr>
  </table>
  <p class="small" style="margin:10px 0 0">Not optional. Knee load is largely determined upstream and downstream of the knee itself.</p></div>

  <h2>Treat the donut, not the hole</h2>
  <div class="card"><p class="small" style="margin:0">Tendon imaging abnormalities are common in people with no symptoms and correlate poorly with pain; symptoms improve without structural change on imaging (van Ark 2018). The tendon has a healthy, load-bearing region around the pathological area — the donut — and rehab works by building capacity there, not by repairing the hole. Which is why your progress metric is <strong>what you can load without a 24-hour flare</strong>, and never a scan.</p></div>

  <h2>Tests · every 4 weeks</h2>
  <div class="scroll"><table class="tbl"><tr><th>Test</th><th>Method</th><th>Target</th></tr>
    <tr><td>Single-leg decline squat</td><td class="small">25° board, single leg, ~60° flexion, rate 0–10</td><td class="m">↓ trend; ≤2/10</td></tr>
    <tr><td>Single-leg press</td><td class="small">Work up to a heavy 5, pain-free, both legs</td><td class="m">≈150% BW</td></tr>
    <tr><td>L–R asymmetry</td><td class="small">Compare single-leg 5RM</td><td class="m">within 10%</td></tr>
    <tr><td>Aerobic threshold</td><td class="small">30 min at fixed HR, record distance/power</td><td class="m">↑ per 8 wks</td></tr>
  </table></div>

  <div class="note halt"><div class="nt">Plyometric gate — all three, not any one</div>
    <p>No jumping, bounding, depth work or reactive loading enters this programme until: single-leg press ≈150% bodyweight pain-free on <strong>both</strong> legs; single-leg decline squat ≤2/10; and four consecutive weeks with no 24-hour flare. When all three are met, add plyometrics as a fourth category on Lower A — low volume, high quality, early in the session. Note this is the one context where the concurrent-training interference effect genuinely applies, so keep the 4×4 at least 48 h from power work.</p></div>`;
}
async function logKnee(v){
  state.knee.push({d:new Date().toISOString().slice(0,10), v});
  if(state.knee.length>60) state.knee=state.knee.slice(-60);
  await store.set("knee",state.knee);
  renderKnee();
}

   PLAN
   ============================================================ */
function renderPlan(){
  $("#v-plan").innerHTML = `
  <h2>Twelve weeks · two parallel tracks</h2>
  <p class="small">The strength track progresses by double progression, gated on performance. The tendon track progresses by load and rep-range on a fixed schedule, gated on symptoms. They share sessions but not logic.</p>
  <div class="scroll"><table class="tbl">
    <tr><th>Wk</th><th>Phase</th><th>Strength / hypertrophy</th><th>Tendon (HSR)</th><th>RIR</th></tr>
    ${PROG.map(p=>`<tr><td class="m">${p.w}</td><td class="m" style="color:var(--load)">${p.p}</td><td class="small">${p.s}</td><td class="small" style="color:#c0aede">${p.t}</td><td class="m">${p.r}</td></tr>`).join("")}
  </table></div>
  <div class="note tendon"><div class="nt">The rule that overrides the table</div>
    <p>You advance a tendon tier only when the previous tier has been tolerated for <strong>two consecutive sessions</strong> under the 24-hour rule. If it has not, you repeat the tier. A tendon that takes 16 weeks to reach 6RM has still succeeded. One rushed to 6RM in 8 weeks and flared has not.</p></div>
  <p class="small"><strong>After week 12:</strong> repeat with new exercise variations in the same movement patterns, restarting the HSR track at ~12RM with the higher absolute loads you have earned. Retest the single-leg press and the aerobic threshold in week 13.</p>

  <h2>Deload</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m" style="color:var(--load)">−40–50%</td><td>Volume. Roughly halve the sets.</td></tr>
    <tr><td class="m" style="color:var(--load)">RIR 3–4</td><td>Effort, across the board.</td></tr>
    <tr><td class="m" style="color:var(--load)">Keep</td><td>Load (or −10%) and all movement patterns. Do not go light and high-rep — that is a different stimulus, not a deload.</td></tr>
    <tr><td class="m" style="color:var(--load)">Keep</td><td>Frequency. Same four lifting days.</td></tr>
    <tr><td class="m" style="color:var(--aero)">Continue</td><td>Zone 2 — already low-cost.</td></tr>
    <tr><td class="m" style="color:var(--halt)">Skip</td><td>The 4×4. Replace with Zone 2.</td></tr>
  </table></div>
  <div class="note"><div class="nt" style="color:var(--ash)">Why deload, honestly</div>
    <p>Deloading is near-universal practice with surprisingly thin direct support. A survey of 246 competitive athletes found deloads every 5.6 ± 2.3 weeks lasting 6.4 ± 1.7 days, with volume cut, frequency kept and effort reduced via RIR — exactly the prescription above, derived from practice rather than outcome trials. Coleman 2024 tested a one-week deload and found <strong>no</strong> hypertrophy benefit.</p>
    <p><strong>So why do it?</strong> Not for muscle — for the tendon and joints. Connective tissue adapts on a slower timescale than muscle, and a symptomatic patellar tendon taking twice-weekly heavy slow loading for six straight weeks is the thing most likely to force an unplanned break. This deload is tendon insurance, and it is honest to call it that.</p></div>

  <h2>Recovery · in order of leverage</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m">01</td><td><strong>Sleep 7–9 h on a consistent schedule.</strong> The biggest lever, and it needs no fabricated percentage attached. Consistency of timing matters alongside duration.</td></tr>
    <tr><td class="m">02</td><td><strong>Protein 1.6–2.2 g/kg/day</strong> across 3–5 feedings. Upper end while running four lifting days plus tendon rehab.</td></tr>
    <tr><td class="m">03</td><td><strong>Adequate energy.</strong> Your brief omits calories entirely and it matters — hypertrophy, four lifting days, two conditioning days and connective-tissue repair cannot all be funded from a deficit. Run body composition as a separate later block; do not recomp through a tendon rehab phase.</td></tr>
    <tr><td class="m">04</td><td>One full rest day, genuinely off.</td></tr>
    <tr><td class="m">05</td><td>Deload every 6–8 weeks.</td></tr>
    <tr><td class="m">06</td><td>Autoregulate with RIR. The prescription is a target, not a contract — on a bad day, the same RIR at a lower load is correct execution.</td></tr>
    <tr><td class="m">07</td><td>Cardio and lifting fully separated. The ≥6 h rule is satisfied by structure, permanently.</td></tr>
  </table></div>

  <h2>TRT considerations</h2>
  <div class="card">
    <p class="small"><strong>Supported:</strong> restoring testosterone to high-normal increases muscle protein synthesis, satellite-cell activity, lean mass and strength, with dose-dependent effects in the physiological range. Combined with resistance training the effects are additive.</p>
    <p class="small"><strong>Not supported:</strong> that it shortens the MPS window; that it justifies daily muscle hits or higher frequency than an evidence-based natural programme; that it changes the volume or proximity-to-failure landmarks.</p>
    <p class="small" style="margin-bottom:0"><strong>Untested:</strong> that it raises the tolerable-volume ceiling. It is a chain of plausible inferences with no study behind it. Operationally it barely matters — 16–20 fractional sets for priority muscles is what the volume literature supports anyway, and sits well below the ~31-set threshold. Run it; just attribute it correctly.</p></div>
  <div class="scroll"><table class="tbl">
    <tr><th>Marker</th><th>Why</th><th>Typical guidance</th></tr>
    <tr><td class="m">Hematocrit</td><td class="small">Most common lab adverse effect of TRT; raises blood viscosity.</td><td class="small">Baseline, 3–6 months, then annually. Endocrine Society 2018: withhold if &gt;54% until normalised, then resume lower. AUA: ≥54% warrants intervention; some clinicians watch from 50–52%.</td></tr>
    <tr><td class="m">Blood pressure</td><td class="small">TRT and heavy lifting both raise it; intervals add acute load.</td><td class="small">Baseline and regularly. A home cuff between labs is useful.</td></tr>
    <tr><td class="m">Lipids</td><td class="small">Formulation-dependent.</td><td class="small">Per prescriber.</td></tr>
    <tr><td class="m">PSA</td><td class="small">Standard TRT surveillance.</td><td class="small">Per prescriber.</td></tr>
  </table></div>
  <div class="note halt"><div class="nt">Read VO₂max alongside a hematocrit, not instead of one</div>
    <p>The Mendelian randomisation work found <strong>hematocrit and free testosterone in men were both causally associated with higher VO₂max</strong>. So on TRT, an improving VO₂max may partly reflect oxygen-carrying capacity rather than cardiac adaptation — the same physiology your prescriber is monitoring for risk. A rising number is not automatically good news on its own.</p></div>

  <h2>Supplements</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>Dose</th><th>Timing</th><th>Evidence</th></tr>
    <tr><td><strong>Collagen / gelatin<br>+ vitamin C</strong></td><td class="m">15 g<br>+ ~50 mg</td><td class="m">30–60 min pre<br>Lower A & B</td><td class="small">Shaw 2017 roughly doubled collagen I propeptide (n=8). <strong>No strength benefit</strong> (Kirmse 2024). Take it for the tendon, not the lift.</td></tr>
    <tr><td><strong>Creatine monohydrate</strong></td><td class="m">3–5 g</td><td class="m">daily, any time</td><td class="small">Strongest evidence base of any training supplement.</td></tr>
    <tr><td><strong>Omega-3 EPA/DHA</strong></td><td class="m">2–3 g</td><td class="m">with food</td><td class="small">Recovery, soreness, cardiovascular health.</td></tr>
    <tr><td><strong>Vitamin D3</strong></td><td class="m">1,000–2,000 IU</td><td class="m">with fat</td><td class="small"><strong>Test first.</strong> Deficiency is very common among South Asian adults even with high sun exposure — measure 25(OH)D rather than guessing.</td></tr>
  </table></div>
  <div class="note"><div class="nt" style="color:var(--ash)">Not recommended</div>
    <p>Glucosamine and chondroitin (modest for osteoarthritis pain, not tendinopathy), MSM, turmeric/curcumin, proprietary "tendon blends." Promising mechanisms, insufficient outcome data.</p></div>

  <h2>Thresholds that change the plan</h2>
  ${THRESH.map(t=>`<div class="note ${t[2]==='ok'?'':t[2]}" ${t[2]==='ok'?'style="border-color:var(--ok);background:#12291d"':''}>
    <div class="nt" ${t[2]==='ok'?'style="color:var(--ok)"':''}>${t[0]}</div><p>${t[1]}</p></div>`).join("")}`;
}
