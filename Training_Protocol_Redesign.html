<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>Protocol — Final Plan</title>
<style>
:root{
  --ink:#0e1116; --slab:#171c24; --slab-hi:#1f2630; --line:#2a323f; --line-soft:#212936;
  --bone:#e9e7e2; --ash:#8a94a4; --ash-dim:#5f6878;
  --load:#f0a43a; --load-bg:#2b1f0c;
  --aero:#48b6cf; --aero-bg:#0c242b;
  --tendon:#a98bd6; --tendon-bg:#1e1630;
  --halt:#e0645f; --halt-bg:#2b1414;
  --ok:#5cc08e;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --pad:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden}
::selection{background:var(--load);color:#000}
:focus-visible{outline:2px solid var(--aero);outline-offset:2px;border-radius:4px}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}
.view{display:none;padding-top:14px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.mast{border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(180deg,#12161d,var(--ink))}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash-dim)}
.mast h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.mast .sub{font-size:12.5px;color:var(--ash);margin-top:5px}

/* ---- medical banner ---- */
.med{border:1px solid #55242a;background:var(--halt-bg);border-radius:var(--r);padding:13px 15px;margin:14px 0}
.med .nt{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--halt);margin-bottom:6px}
.med p{font-size:13px;color:#d6c3c3;margin-bottom:7px}
.med p:last-child{margin-bottom:0}

/* ============================================================
   SIGNATURE — THE CYCLE SPINE
   Six slots on a continuous vertical line. No weekdays anywhere:
   the sequence is the structure, and rest happens between nodes.
   ============================================================ */
.spine{position:relative;padding-left:38px;margin-top:6px}
.spine::before{content:"";position:absolute;left:14px;top:14px;bottom:34px;width:2px;
  background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}
.slot{position:relative;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot .node{position:absolute;left:-38px;top:16px;width:30px;height:30px;border-radius:50%;
  border:2px solid var(--line);background:var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ash-dim)}
.slot.load .node{border-color:var(--load);color:var(--load)}
.slot.aero .node{border-color:var(--aero);color:var(--aero)}
.slot .body{background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
  transition:transform .14s ease,border-color .14s ease}
.slot:active .body{transform:scale(.985)}
.slot.load .body{border-left:3px solid var(--load)}
.slot.aero .body{border-left:3px solid var(--aero)}
.slot .kind{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash-dim)}
.slot h3{font-size:19px;font-weight:750;letter-spacing:-.02em;margin:3px 0 4px}
.slot .fx{font-size:13px;color:var(--ash);margin-bottom:11px}
.slot .meta{display:flex;gap:6px;flex-wrap:wrap}
.slot .meta span{font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:5px;
  background:var(--ink);border:1px solid var(--line-soft);color:var(--ash)}
.slot .go{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--load);margin-top:11px;display:block}
.slot.aero .go{color:var(--aero)}
.cyc-end{position:relative;padding-left:0;margin:2px 0 20px}
.cyc-end .node{position:absolute;left:-38px;top:0;width:30px;height:30px;border-radius:50%;
  border:2px dashed var(--line);background:var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--ash-dim)}
.cyc-end p{font-size:12.5px;color:var(--ash-dim);padding-top:4px;margin:0}

/* ---- session detail ---- */
.back{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);
  background:none;border:none;padding:6px 0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shead{border-left:3px solid var(--load);padding-left:13px;margin-bottom:16px}
.shead.aero{border-color:var(--aero)}
.shead .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--load)}
.shead.aero .n{color:var(--aero)}
.shead h2{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:3px 0 4px;padding:0;border:none;
  color:var(--bone);text-transform:none;font-family:var(--sans)}
.shead .t{font-size:13px;color:var(--ash)}

h2{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ash);
  margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
h2:first-of-type{margin-top:18px}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:5px}
p{font-size:14px;color:#c6c9d0;margin-bottom:10px}
p.tight{margin-bottom:6px}
strong{color:var(--bone);font-weight:650}
.small{font-size:12.5px;color:var(--ash)}
.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:9px}

.note{border-left:2px solid var(--line);padding:11px 13px;border-radius:0 var(--r) var(--r) 0;background:var(--slab);margin-bottom:10px}
.note .nt{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px}
.note p{font-size:13px;margin-bottom:0;color:#bcc0c9}
.note p + p{margin-top:7px}
.note.load{border-color:var(--load);background:var(--load-bg)}   .note.load .nt{color:var(--load)}
.note.aero{border-color:var(--aero);background:var(--aero-bg)}   .note.aero .nt{color:var(--aero)}
.note.tendon{border-color:var(--tendon);background:var(--tendon-bg)} .note.tendon .nt{color:var(--tendon)}
.note.halt{border-color:var(--halt);background:var(--halt-bg)}   .note.halt .nt{color:var(--halt)}
.note.ok{border-color:var(--ok);background:#12291d}              .note.ok .nt{color:var(--ok)}

/* numbered step list (warm-up, cool-down, prep) */
.steps{counter-reset:st}
.steps .s{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.steps .s:last-child{border-bottom:none}
.steps .s .num{flex:0 0 22px;font-family:var(--mono);font-size:10px;color:var(--ash-dim);padding-top:3px}
.steps .s .tx{flex:1}
.steps .s .tt{font-size:13.5px;font-weight:600;line-height:1.4}
.steps .s .td{font-size:12.5px;color:var(--ash);margin-top:2px;line-height:1.5}
.steps .s .tm{font-family:var(--mono);font-size:11px;color:var(--load);margin-top:3px}

/* exercises */
.ex{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.ex.hsr{border-left:2px solid var(--tendon)}
.ex.neck{border-left:2px solid var(--halt)}
.ex.opt{border-style:dashed}
.ex-h{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-h:active{background:var(--slab-hi)}
.ex-n{font-family:var(--mono);font-size:10.5px;color:var(--ash-dim);min-width:16px;padding-top:2px}
.ex-b{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;letter-spacing:-.005em}
.ex-dose{font-family:var(--mono);font-size:12px;color:var(--load);margin-top:2px}
.ex.hsr .ex-dose{color:var(--tendon)}
.ex-car{color:var(--ash-dim);font-size:11px;transition:transform .2s}
.ex.open .ex-car{transform:rotate(90deg)}
.ex-d{display:none;padding:0 14px 14px;border-top:1px solid var(--line-soft)}
.ex.open .ex-d{display:block}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 11px}
.spec div{background:var(--ink);border:1px solid var(--line-soft);border-radius:6px;padding:6px 8px}
.spec .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim)}
.spec .v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:2px;white-space:nowrap}
.why{font-size:12.5px;color:var(--ash);line-height:1.5;margin-top:11px}
.why b{color:#c9ccd4;font-weight:600}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 2px}
.pill{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:5px;background:var(--ink);
  border:1px solid var(--line);color:var(--ash)}
.pill.hl{border-color:var(--tendon);color:var(--tendon)}
.pill.warn{border-color:var(--halt);color:var(--halt)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 4px}
@media (max-width:400px){.dd{grid-template-columns:1fr;gap:11px}}
.dd h5{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.dd .do h5{color:var(--ok)} .dd .dont h5{color:var(--halt)}
.dd .it{font-size:12px;color:#b6bac3;padding:4px 0 4px 15px;position:relative;line-height:1.45}
.dd .do .it::before{content:"✓";position:absolute;left:0;top:4px;color:var(--ok);font-size:10px;font-weight:700}
.dd .dont .it::before{content:"✕";position:absolute;left:0;top:4px;color:var(--halt);font-size:10px;font-weight:700}
a.vid{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;margin-top:11px;
  border-radius:8px;background:#2a1214;border:1px solid #55242a;color:#e88;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;-webkit-tap-highlight-color:transparent}
a.vid:active{opacity:.75}
a.vid.sm{padding:8px;font-size:10px;margin-top:9px}

/* tools */
.tool{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px}
.tool-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tool-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.tool-hint{font-size:11px;color:var(--ash-dim)}
.readout{font-family:var(--mono);font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;color:var(--ash)}
.bar{height:4px;background:var(--ink);border-radius:2px;margin:13px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--load);border-radius:2px}
.bar i.aero{background:var(--aero)} .bar i.tendon{background:var(--tendon)}
.btns{display:flex;gap:7px}
button.b{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--slab-hi);
  color:var(--bone);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
button.b:active{transform:scale(.97)}
button.b.go{background:var(--load);border-color:var(--load);color:#000;font-weight:700}
button.b.go.aero{background:var(--aero);border-color:var(--aero)}
button.b.go.tendon{background:var(--tendon);border-color:var(--tendon)}
.pacer{height:52px;background:var(--ink);border-radius:8px;position:relative;overflow:hidden;margin-bottom:12px;border:1px solid var(--line-soft)}
.pacer i{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--tendon);box-shadow:0 0 12px var(--tendon)}
.pacer span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}

/* HR */
.hrbox{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px}
.hrbig{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hrsub{font-size:12px;color:var(--ash);margin-top:5px}
.hrin{display:flex;gap:8px;align-items:center;margin-top:12px}
.hrin input{width:76px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;
  color:var(--bone);font-family:var(--mono);font-size:14px;text-align:center}
.hrin label{font-size:11.5px;color:var(--ash-dim);line-height:1.35}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim);
  text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl td.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.vd{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:2px 6px;
  border-radius:4px;white-space:nowrap;text-transform:uppercase}
.vd.s{background:#123021;color:var(--ok)} .vd.p{background:var(--load-bg);color:var(--load)}
.vd.c{background:var(--halt-bg);color:var(--halt)} .vd.u{background:var(--tendon-bg);color:var(--tendon)}
.cite{font-family:var(--mono);font-size:10.5px;color:var(--ash-dim);line-height:1.6;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.cite b{color:var(--ash);font-weight:500}
.vol{margin-bottom:9px}
.vol-t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.vol-t span:last-child{font-family:var(--mono);color:var(--ash);font-size:11.5px}
.vol-b{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--line-soft)}
.vol-b i{display:block;height:100%;border-radius:3px;background:var(--ash-dim)}
.vol-b i.pri{background:var(--load)} .vol-b i.reh{background:var(--tendon)}
.vol-b u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line);text-decoration:none}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,17,22,.96);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav button{flex:1;min-width:0;background:none;border:none;padding:11px 2px 12px;color:var(--ash-dim);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
  -webkit-tap-highlight-color:transparent;border-top:2px solid transparent;margin-top:-1px}
nav button.on{color:var(--bone);border-top-color:var(--load)}
nav button .ic{display:block;font-size:15px;margin-bottom:3px;line-height:1}
.foot{font-size:11px;color:var(--ash-dim);line-height:1.6;padding:24px 0 10px;border-top:1px solid var(--line-soft);margin-top:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="eyebrow">Final plan · no phases · run in sequence</div>
    <h1>Six-Slot Cycle</h1>
    <div class="sub">Lower → Upper → Zone 2 → Lower → Upper → VO₂max · rest whenever you need to</div>
  </div>
</header>

<main class="wrap">
  <section id="v-cycle" class="view on"></section>
  <section id="v-knee" class="view"></section>
  <section id="v-nerve" class="view"></section>
  <section id="v-notes" class="view"></section>
  <section id="v-eviq" class="view"></section>
  <div class="foot" id="foot"></div>
</main>

<nav>
  <button data-v="cycle" class="on"><span class="ic">⛓</span>Cycle</button>
  <button data-v="knee"><span class="ic">◈</span>Knee</button>
  <button data-v="nerve"><span class="ic">⚡</span>Nerve</button>
  <button data-v="notes"><span class="ic">⟶</span>Notes</button>
  <button data-v="eviq"><span class="ic">§</span>Data</button>
</nav>

<script>
const CUES = {
"Spanish squat isometric":{t:"Quads · patellar tendon",eq:"Heavy band + rack",vid:"Spanish squat isometric patellar tendinopathy setup",
 do:["Anchor a thick band behind the knees at knee height, not higher","Keep the torso near-vertical the whole hold — shins go forward, chest stays up","Sit back into the band until you feel it load the front of the knee","Aim for ~70% effort: hard, but you could hold 60 s if forced","Stop the set if pain climbs above 3/10"],
 dont:["Don't let the torso pitch forward — that turns it into a hip exercise","Don't anchor the band low; it drags the knees down instead of back","Don't do this right before heavy hack squats if it leaves the quads cooked","Don't treat it as a required stage — it's optional (n=6 evidence)"]},

"Hack squat or pendulum squat":{t:"Quads · patellar tendon",eq:"Hack or pendulum machine",vid:"hack squat form tempo heavy slow resistance",
 do:["Count it out loud: 3 seconds down, 3 seconds up, every rep","Feet mid-platform, roughly shoulder width — this is a quad movement","Descend to the deepest range you can hold ≤3/10 pain, then own it","Add load only when the previous tier passed the 24-hour rule twice","Keep the low back flat against the pad throughout"],
 dont:["Don't bounce out of the bottom — the eccentric is the point","Don't let the tempo break on the last two reps; the set ended there","Don't chase depth past the pain rule to prove something","Don't place feet high on the platform — that shifts load to the hips"]},

"Leg press":{t:"Quads · glutes",eq:"Leg press",vid:"leg press form knee safe foot placement",
 do:["Feet mid-platform, hip width, toes very slightly out","Lower until the pelvis is about to tuck, then drive","Keep a soft knee at the top — never slam into lockout","Use this to test single-leg 150% bodyweight every 4 weeks"],
 dont:["Don't let the lower back round off the pad at the bottom","Don't lock out hard and hang on the joints between reps","Don't go so heavy the tempo collapses","Don't put your hands on your knees to push"]},

"Seated leg extension — long length":{t:"Quads · patellar tendon",eq:"Leg extension",vid:"leg extension long length partial rectus femoris",
 do:["Sit tall or slightly reclined so the quad starts stretched","3 seconds up, 3 seconds down — this is a tendon-loading set","Set the pad just above the ankle, not on the shin","Pause a beat at the top only if it stays under 3/10"],
 dont:["Don't kick explosively into extension","Don't let the weight drop back — the lowering phase is where the tendon works","Don't grip the handles and rock the torso to cheat reps","Don't skip this because it 'isn't functional' — it's the cleanest tendon dose you have"]},

"Seated leg extension":{t:"Quads · patellar tendon",eq:"Leg extension",vid:"leg extension form tempo controlled",
 do:["Same 3s/3s tempo as Lower A — this is the second weekly tendon dose","Match reps left and right; lead with the left","Keep the hips pinned to the seat back","Log the load so you can drive the 15RM → 6RM track"],
 dont:["Don't let this become an afterthought at the end of the session","Don't add extra sets on the left just because it's worse","Don't swing into the top position","Don't progress load if yesterday's knee score was above 3"]},

"Romanian deadlift":{t:"Hamstrings · erectors",eq:"Barbell or DBs",vid:"Romanian deadlift form hip hinge technique",
 do:["Push the hips back; the bar stays in contact with the legs","Lower until you feel a hard hamstring stretch, then stop","Keep the ribs down and the mid-back braced","Squeeze the glutes to finish — don't lean back past neutral"],
 dont:["Don't turn it into a squat by bending the knees more as you descend","Don't round the lower back to chase extra range","Don't bounce the plates off the floor","Don't grind this to failure — it's a fatigue-expensive lift"]},

"Standing calf raise — straight knee":{t:"Gastrocnemius",eq:"Standing calf machine",vid:"standing calf raise gastrocnemius full range",
 do:["Keep the knee straight — that's what loads the gastroc","Full range: deep stretch at the bottom, hard squeeze at the top","2 seconds up, 2 second pause, 2 seconds down","Balls of the feet on the block, heels free to drop below"],
 dont:["Don't bend the knees — that shifts the work to the soleus","Don't bounce out of the stretch using the Achilles like a spring","Don't cut the range short to add weight","Don't rush — calves respond to time under tension"]},

"Seated calf raise — bent knee":{t:"Soleus",eq:"Seated calf machine",vid:"seated calf raise soleus form",
 do:["Knees bent ~90° — this is what isolates the soleus","Pad sits low on the thigh, close to the knee","Full stretch at the bottom, pause at the top","Higher reps (12–15) suit the soleus's fibre profile"],
 dont:["Don't half-rep it — the stretch is where the growth is","Don't let the heels bounce","Don't skip this thinking standing raises cover it — they don't","Don't place the pad on the mid-thigh; it slides"]},

  <div class="spine">
    ${CYCLE.map(c=>{

                          : ["~38 min", `${Math.round(hrmax()*.90)}–${Math.round(hrmax()*.95)} bpm`, "or swap Zone 2"]);
      return `<div class="slot ${c.aero?'aero':'load'}" onclick="openSession('${c.id}')">

    }).join("")}
    <div class="cyc-end"><div class="node">↻</div>
      <p>Then back to 01. Aim to close a cycle in <strong>6 to 8 days</strong> — stretch it much past that and every muscle drops below twice a week, and the volume this plan is built on stops being true.</p></div>
  </div>

  <h2>Why this order</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m" style="color:var(--load)">72 h</td><td>Between Lower A and Lower B, and between Upper A and Upper B, if you run the slots back to back.</td></tr>
    <tr><td class="m" style="color:var(--aero)">Slot 03</td><td>Zone 2 sits between the two lower days as active recovery.</td></tr>
    <tr><td class="m" style="color:var(--aero)">Slot 06</td><td>Intervals land two slots after the last heavy lower day, and immediately before Lower A comes round again.</td></tr>

  <p class="small">Interference from combining lifting and cardio is small in the pooled data, but it concentrates in exactly your profile — lower-body maximal strength in trained males (SMD −0.43), and mostly when the two are done in the same session. Keeping them on separate days removes the condition where the effect appears.</p>`;
}

function tempoTool(){return `<div class="tool">

function intervalTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">4×4 interval timer</span><span class="tool-hint">~38 min total</span></div>
  <div class="readout" id="ivR">10:00</div><div class="phase" id="ivP">Warm-up · ready</div>

  <div class="btns"><button class="b go aero" id="ivgo" onclick="toggleTimer('iv')">Start</button><button class="b" onclick="resetTimer('iv')">Reset</button></div></div>`;}
function restTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">Rest timer</span><span class="tool-hint">tap to set</span></div>
  <div class="readout" id="rsR">3:00</div><div class="phase" id="rsP">ready</div>
  <div class="bar"><i id="rsB"></i></div>
  <div class="btns" style="margin-bottom:7px">
    <button class="b" onclick="setRest(60)">60 s</button><button class="b" onclick="setRest(90)">90 s</button>
    <button class="b" onclick="setRest(120)">2 min</button><button class="b" onclick="setRest(180)">3 min</button>
    <button class="b" onclick="setRest(300)">5 min</button></div>
  <div class="btns"><button class="b go" id="rsgo" onclick="toggleTimer('rs')">Start</button><button class="b" onclick="resetTimer('rs')">Reset</button></div></div>`;}

const IV_PHASES=[["Warm-up",600],["Interval 1",240],["Recovery",180],["Interval 2",240],["Recovery",180],["Interval 3",240],["Recovery",180],["Interval 4",240],["Cool-down",300]];
const HD_PHASES=[["Hold 1",45],["Rest",120],["Hold 2",45],["Rest",120],["Hold 3",45],["Rest",120],["Hold 4",45],["Rest",120],["Hold 5",45]];
const T={ iv:{ph:IV_PHASES,i:0,left:600,on:false,r:"ivR",p:"ivP",b:"ivB",g:"ivgo"},
          hd:{ph:HD_PHASES,i:0,left:45,on:false,r:"hdR",p:"hdP",b:"hdB",g:"hdgo"},
          rs:{ph:[["Rest",180]],i:0,left:180,on:false,r:"rsR",p:"rsP",b:"rsB",g:"rsgo"} };
function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return m>0?m+":"+String(x).padStart(2,"0"):String(x);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function paint(k){
  const t=T[k], r=document.getElementById(t.r); if(!r) return;
  const [nm,dur]=t.ph[t.i];
  r.textContent=fmt(Math.ceil(t.left));
  document.getElementById(t.p).textContent = k==="hd" ? `${nm} · ${Math.floor(t.i/2)+1} of 5`
    : (t.ph.length>1 ? `${nm} · ${t.i+1} of ${t.ph.length}` : nm);
  document.getElementById(t.b).style.width = ((dur-t.left)/dur*100)+"%";
  const g=document.getElementById(t.g); if(g) g.textContent = t.on?"Pause":"Start";
}
function toggleTimer(k){ T[k].on=!T[k].on; paint(k); }
function resetTimer(k){ const t=T[k]; t.on=false; t.i=0; t.left=t.ph[0][1]; paint(k); }
function setRest(s){ T.rs.ph=[["Rest",s]]; resetTimer("rs"); }
const PC={on:false,t:0,half:-1};
function togglePacer(){ PC.on=!PC.on; if(PC.on){PC.t=0;PC.half=-1;}
  const g=document.getElementById("pcgo"); if(g) g.textContent=PC.on?"Stop":"Start";
  if(!PC.on){const l=document.getElementById("pct"); if(l) l.textContent="Ready";} }
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  Object.keys(T).forEach(k=>{ const t=T[k]; if(!t.on) return;
    if(!document.getElementById(t.r)) return;
    t.left-=dt;
    if(t.left<=0){ if(t.i<t.ph.length-1){ t.i++; t.left=t.ph[t.i][1]; buzz([90,60,90]); }
                   else { t.on=false; t.left=0; buzz([200,80,200,80,200]); } }
    paint(k); });
  if(PC.on){ PC.t+=dt; const cyc=PC.t%6, up=cyc<3;
    const bar=document.getElementById("pcb"), lab=document.getElementById("pct");
    if(bar){ bar.style.left=(up?cyc/3:(1-(cyc-3)/3))*98+"%";
      lab.textContent=(up?"UP  ":"DOWN  ")+(up?Math.ceil(3-cyc):Math.ceil(3-(cyc-3)));
      if(Math.floor(PC.t/3)!==PC.half){ PC.half=Math.floor(PC.t/3); buzz(35); } } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  <h2>Treat the donut, not the hole</h2>
  <div class="card"><p class="small" style="margin:0">Tendon imaging abnormalities are common in people with no symptoms and correlate poorly with pain; symptoms improve without structural change on imaging. Rehab works by building capacity in the healthy tissue around the pathology. Your progress metric is <strong>what you can load without a 24-hour flare</strong> — never a scan.</p></div>

  <h2>The plyometric gate</h2>
  <div class="note halt"><div class="nt">All three, not any one</div>
    <p>No jumping, bounding or reactive loading until: single-leg press about 150% bodyweight pain-free on <strong>both</strong> legs; single-leg decline squat at 2/10 or below; and four clear weeks with no 24-hour flare. Even then, given the current neurological situation, clear it with your doctor first.</p></div>

  <h2>Supporting work, already in the plan</h2>
  <div class="card"><table class="tbl">
    <tr><td>Glute medius · hip abduction</td><td class="m">both lower slots</td></tr>
    <tr><td>Adductors · Copenhagen</td><td class="m">both lower slots</td></tr>
    <tr><td>Hamstrings · seated curl + Nordic</td><td class="m">slot 04</td></tr>
    <tr><td>Tibialis anterior</td><td class="m">both lower slots</td></tr>
    <tr><td>Gastrocnemius / soleus</td><td class="m">both, each slot</td></tr>
  </table></div>
  <a class="vid sm" href="${yt('Nordic hamstring curl progression beginner')}" target="_blank" rel="noopener">▶ Nordic hamstring progression</a>
  <a class="vid sm" href="${yt('Copenhagen adduction progression short lever')}" target="_blank" rel="noopener">▶ Copenhagen progression</a>`;
}

/* ============================================================
   NERVE — the new situation
   ============================================================ */
function renderNerve(){
  $("#v-nerve").innerHTML = `
  <div class="med">
    <div class="nt">Get this looked at</div>
    <p>Two neurological episodes now, months apart, in different parts of the body: four months of right-leg numbness that resolved on its own, and an acute simultaneous right perioral and right little-finger event during heavy training.</p>
    <p>The C8-and-trigeminal explanation is anatomically coherent for the second event. <strong>It does not account for the first.</strong> Mechanical compression from lifting resolves in hours to days, as your finger did — it does not usually produce four months of numbness and then clear. Two events separated in time and location is the pattern that triggers a workup rather than form coaching.</p>
    <p><strong>Ask for:</strong> haematocrit and haemoglobin, blood pressure, and a neurological examination. Mention the four-month leg episode explicitly — that is the detail that changes what they look for. Imaging of brain and cervical spine may follow depending on the exam.</p>
  </div>

  <h2>Why TRT raises the stakes</h2>
  <div class="card"><p class="small">Testosterone therapy raises haematocrit. Raised haematocrit raises blood viscosity, and that raises thrombotic risk. Acute one-sided facial numbness in a man on TRT who lifts heavily is a scenario where <strong>stroke and TIA need excluding</strong>, not reasoning around.</p>
  <p class="small" style="margin-bottom:0">Endocrine Society guidance: check haematocrit at baseline, 3–6 months, then annually; withhold testosterone above 54% until it normalises. Some clinicians watch from 50–52%. If yours is drifting up, that is directly relevant to what you are experiencing.</p></div>

  <h2>Emergency signs</h2>
  <div class="note halt"><div class="nt">Stop everything and seek emergency care</div>
    ${NEURO_STOP.map(x=>`<p>— ${x}</p>`).join("")}</div>

  <h2>What changed in the plan because of this</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m" style="color:var(--halt)">Removed</td><td><strong>All neck training.</strong> It was optional in the first place and it loads exactly the tissue implicated.</td></tr>
    <tr><td class="m" style="color:var(--halt)">Removed</td><td><strong>Any behind-the-neck movement.</strong> None remain in the plan.</td></tr>
    <tr><td class="m" style="color:var(--load)">Changed</td><td><strong>Overhead press is now seated with a back pad.</strong> A standing press loads the neck stabilisers and invites breath-holding.</td></tr>
    <tr><td class="m" style="color:var(--load)">Changed</td><td><strong>Shrugs lightened</strong> to 2 × 12–15 at moderate load, no straps.</td></tr>
    <tr><td class="m" style="color:var(--load)">Added</td><td><strong>Cervical mobility and a breathing/bracing drill</strong> to every warm-up.</td></tr>
    <tr><td class="m" style="color:var(--load)">Added</td><td><strong>A neck decompression step</strong> to every cool-down.</td></tr>
    <tr><td class="m" style="color:var(--halt)">Gated</td><td><strong>The 4×4 needs clearance</strong> before you run it. Zone 2 fills the slot meanwhile.</td></tr>
    <tr><td class="m" style="color:var(--ok)">Rule</td><td><strong>Exhale on effort. Never hold your breath under load.</strong> This applies to every set of every session.</td></tr>
  </table></div>

  <h2>The breathing rule, in detail</h2>
  <div class="note load"><div class="nt">Why this matters more than any exercise swap</div>
    <p>A hard Valsalva — bracing by holding your breath — raises pressure in the chest, which raises venous pressure in the head and neck. Combined with a strained neck position and tight scalenes, that is the most plausible mechanical route to irritating both the C8 root and the descending trigeminal tract at the same instant.</p>
    <p>You still need to brace. You just need to brace <strong>while exhaling</strong> rather than against a closed throat. Practise it in the warm-up: hand on the belly, create trunk stiffness, then breathe out slowly while keeping the stiffness. If you cannot complete a rep this way, the load is too heavy for today.</p></div>
  <a class="vid sm" href="${yt('brace core without holding breath exhale on effort lifting')}" target="_blank" rel="noopener">▶ Bracing without breath-holding</a>
  <a class="vid sm" href="${yt('cervical mobility chin nod upper trap scalene stretch routine')}" target="_blank" rel="noopener">▶ Neck mobility routine</a>

  <h2>If symptoms return during a session</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m">01</td><td>Rack the weight. End the session — do not finish the remaining exercises.</td></tr>
    <tr><td class="m">02</td><td>Note what you were doing, the load, and whether you were holding your breath.</td></tr>
    <tr><td class="m">03</td><td>If anything on the emergency list above appears, seek care immediately.</td></tr>
    <tr><td class="m">04</td><td>If not, tell your doctor at the next appointment regardless. A pattern of recurrence is diagnostic information.</td></tr>
    <tr><td class="m">05</td><td>Next session: drop loads about 20%, remove overhead work entirely, and rebuild only once you are symptom-free across two full cycles.</td></tr>
  </table></div>
  <p class="small">None of this is a reason to stop training. It is a reason to train in a way that stops making the same event more likely while you find out what is going on.</p>`;
}

/* ============================================================
   NOTES
   ============================================================ */
function volume(){
  const tot={},freq={};
  Object.entries(S).forEach(([k,ses])=>{
    const seen=new Set();
    ses.ex.forEach(e=>{
      (e.m||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n; seen.add(mu); });
      (e.i||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n*0.5; seen.add(mu); });
    });
    seen.forEach(mu=>freq[mu]=(freq[mu]||0)+1);
  });
  return Object.entries(tot).map(([mu,v])=>({mu,v:Math.round(v*10)/10,f:freq[mu]})).sort((a,b)=>b.v-a.v);
}
function renderNotes(){
  const vols=volume(), max=Math.max(...vols.map(v=>v.v));
  $("#v-notes").innerHTML = `
  <h2>Recovery, in order of leverage</h2>
  <div class="card"><table class="tbl">
    <tr><td class="m">01</td><td><strong>Sleep 7–9 h on a consistent schedule.</strong> The biggest lever, and it needs no invented statistic to justify it.</td></tr>
    <tr><td class="m">02</td><td><strong>Protein 1.6–2.2 g/kg/day</strong> across 3–5 feedings, upper end while running this plan.</td></tr>
    <tr><td class="m">03</td><td><strong>Eat enough.</strong> Hypertrophy, tendon repair and six slots per cycle cannot be funded from a deficit. Run fat loss as a separate block later.</td></tr>
    <tr><td class="m">04</td><td>Rest days between any slots, as many as you need.</td></tr>
    <tr><td class="m">05</td><td>Autoregulate with RIR. The prescription is a target, not a contract — on a bad day the same RIR at a lower load is correct.</td></tr>
    <tr><td class="m">06</td><td>Lifting and conditioning never share a day. Built into the structure.</td></tr>
  </table></div>

  <h2>When to take a lighter cycle</h2>
  <div class="note load"><div class="nt">Triggered, not scheduled</div>
    ${LIGHTER.map(x=>`<p>— ${x}</p>`).join("")}</div>
  <div class="card"><p class="small"><strong>What a lighter cycle looks like:</strong> volume cut roughly in half, effort at RIR 3–4, load and movement patterns kept. Zone 2 continues; skip the 4×4.</p>
  <p class="small" style="margin-bottom:0"><strong>Why, honestly:</strong> not for muscle. A survey of 246 competitive athletes found deloads roughly every 5.6 weeks, and Coleman 2024 tested a one-week deload and found no hypertrophy benefit. You take lighter cycles here for the <strong>tendon and joints</strong> — connective tissue adapts slower than muscle, and a symptomatic patellar tendon under twice-weekly heavy slow loading is the thing most likely to force an unplanned break.</p></div>

  <h2>TRT</h2>
  <div class="card">
    <p class="small"><strong>Supported:</strong> restoring testosterone to high-normal increases muscle protein synthesis, lean mass and strength, dose-dependently within the physiological range, and the effects with training are additive.</p>
    <p class="small"><strong>Not supported:</strong> that it shortens the MPS window, justifies daily muscle hits, or changes the volume and proximity-to-failure landmarks.</p>
    <p class="small" style="margin-bottom:0"><strong>Untested:</strong> that it raises the tolerable-volume ceiling. Plausible chain of inferences, no study behind it. The set counts here are justified by the volume literature, not by your prescription.</p></div>
  <div class="scroll"><table class="tbl">
    <tr><th>Marker</th><th>Why</th><th>Guidance</th></tr>
    <tr><td class="m">Haematocrit</td><td class="small">Most common lab effect of TRT; raises viscosity. <strong>Directly relevant to your current symptoms.</strong></td><td class="small">Baseline, 3–6 months, then annually. Endocrine Society: withhold above 54% until normalised. AUA: ≥54% warrants intervention; some watch from 50–52%.</td></tr>

    <tr><td class="m">Lipids</td><td class="small">Formulation-dependent.</td><td class="small">Per prescriber.</td></tr>
    <tr><td class="m">PSA</td><td class="small">Standard surveillance.</td><td class="small">Per prescriber.</td></tr>
  </table></div>
  <div class="note halt"><div class="nt">Read VO₂max alongside a haematocrit, not instead of one</div>
    <p>Mendelian randomisation found haematocrit and free testosterone in men were both causally associated with higher VO₂max. On TRT, an improving VO₂max may partly reflect oxygen-carrying capacity rather than cardiac adaptation — the same physiology being monitored for risk. A rising number is not automatically good news.</p></div>

  <h2>Supplements</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>Dose</th><th>Timing</th><th>Evidence</th></tr>
    <tr><td><strong>Collagen or gelatin + vitamin C</strong></td><td class="m">15 g<br>+ ~50 mg</td><td class="m">30–60 min before<br>slots 01 and 04</td><td class="small">Shaw 2017 roughly doubled collagen I propeptide (n=8). <strong>No strength benefit</strong> (Kirmse 2024). Take it for the tendon, not the lift.</td></tr>
    <tr><td><strong>Creatine monohydrate</strong></td><td class="m">3–5 g</td><td class="m">daily, any time</td><td class="small">Strongest evidence base of any training supplement.</td></tr>

  </table></div>
  <div class="note"><div class="nt" style="color:var(--ash)">Not recommended</div>

    return `<div class="vol"><div class="vol-t"><span>${v.mu} <span style="color:var(--ash-dim);font-size:11px">${v.f}× per cycle</span></span><span>${v.v}</span></div>

  <p class="small" style="margin-top:14px">Every muscle twice per cycle. Marker line is 16 sets. Stretch a cycle beyond about 8 days and these numbers stop being true.</p>`;
}
