<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<title>Protocol v2 — Full Separation</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Palette: iron + chalk. Four accents, each carrying meaning:
     load   = resistance work
     aero   = conditioning work
     tendon = HSR / knee track
     halt   = stop rules
   Type thesis: prescriptions are monospaced data; reasoning is prose.
   ============================================================ */
:root{
  --ink:#0e1116;
  --slab:#171c24;
  --slab-hi:#1f2630;
  --line:#2a323f;
  --line-soft:#212936;
  --bone:#e9e7e2;
  --ash:#8a94a4;
  --ash-dim:#5f6878;

  --load:#f0a43a;
  --load-bg:#2b1f0c;
  --aero:#48b6cf;
  --aero-bg:#0c242b;
  --tendon:#a98bd6;
  --tendon-bg:#1e1630;
  --halt:#e0645f;
  --halt-bg:#2b1414;
  --ok:#5cc08e;

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --r:10px;
  --pad:16px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
::selection{background:var(--load);color:#000}
:focus-visible{outline:2px solid var(--aero);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}
.view{display:none;padding-top:14px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- masthead ---------- */
.mast{
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(180deg,#12161d,var(--ink));
}
.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ash-dim);
}
.mast h1{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.02em;
  margin-top:3px;
  line-height:1.15;
}
.mast .sub{font-size:12.5px;color:var(--ash);margin-top:5px}
.rule-line{
  font-family:var(--mono);
  font-size:11px;
  color:var(--load);
  margin-top:9px;
  letter-spacing:.02em;
  border-left:2px solid var(--load);
  padding-left:9px;
}

/* ============================================================
   SIGNATURE — THE TWO-LANE WEEK
   Resistance rides the upper rail. Conditioning rides the lower.
   The gap between them is the entire point of this redesign.
   ============================================================ */
.rail{
  position:relative;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin:18px 0 8px;
  padding:6px 0 8px;
}
.rail::before{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);
}
.col{
  position:relative;
  display:grid;
  grid-template-rows:52px 20px 52px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.col .dow{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.08em;
  color:var(--ash-dim);
  background:var(--ink);
  padding:0 3px;
  z-index:2;
}
.chip{
  overflow:hidden;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--slab);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:4px 2px;
  transition:transform .14s ease,border-color .14s ease;
}
.col:active .chip{transform:scale(.95)}
.chip .ct{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.chip .cs{font-size:8px;color:var(--ash-dim);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.chip.top{grid-row:1}
.chip.bot{grid-row:3}
.chip.load{border-color:#4a3413;background:var(--load-bg)}
.chip.load .ct{color:var(--load)}
.chip.aero{border-color:#123540;background:var(--aero-bg)}
.chip.aero .ct{color:var(--aero)}
.chip.rest{grid-row:1/4;align-self:center;height:52px;border-style:dashed;background:transparent}
.chip.rest .ct{color:var(--ash-dim)}
.col.sel .chip{border-color:var(--bone)}
.col.sel .chip.load{box-shadow:0 0 0 1px var(--load) inset}
.col.sel .chip.aero{box-shadow:0 0 0 1px var(--aero) inset}
.tdot{
  position:absolute;
  bottom:-3px;left:50%;
  transform:translateX(-50%);
  width:5px;height:5px;
  border-radius:50%;
  background:var(--tendon);
}
.rail-key{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.05em;
  color:var(--ash-dim);
  text-transform:uppercase;
  padding-bottom:16px;
  border-bottom:1px solid var(--line-soft);
}
.rail-key i{
  display:inline-block;
  width:7px;height:7px;
  border-radius:2px;
  margin-right:5px;
  vertical-align:middle;
}

/* ---------- generic blocks ---------- */
h2{
  font-size:12px;
  font-family:var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ash);
  margin:26px 0 10px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line-soft);
}
h2:first-of-type{margin-top:18px}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:5px}
p{font-size:14px;color:#c6c9d0;margin-bottom:10px}
p.tight{margin-bottom:6px}
strong{color:var(--bone);font-weight:650}
.small{font-size:12.5px;color:var(--ash)}

.card{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px 15px;
  margin-bottom:9px;
}
.card.flat{background:transparent}

.note{
  border-left:2px solid var(--line);
  padding:11px 13px;
  border-radius:0 var(--r) var(--r) 0;
  background:var(--slab);
  margin-bottom:10px;
}
.note .nt{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:5px;
}
.note p{font-size:13px;margin-bottom:0;color:#bcc0c9}
.note p + p{margin-top:7px}
.note.load{border-color:var(--load);background:var(--load-bg)}
.note.load .nt{color:var(--load)}
.note.aero{border-color:var(--aero);background:var(--aero-bg)}
.note.aero .nt{color:var(--aero)}
.note.tendon{border-color:var(--tendon);background:var(--tendon-bg)}
.note.tendon .nt{color:var(--tendon)}
.note.halt{border-color:var(--halt);background:var(--halt-bg)}
.note.halt .nt{color:var(--halt)}

/* ---------- exercise cards ---------- */
.ex{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:7px;
  overflow:hidden;
}
.ex.hsr{border-left:2px solid var(--tendon)}
.ex.opt{border-style:dashed}
.ex-h{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.ex-h:active{background:var(--slab-hi)}
.ex-n{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ash-dim);
  min-width:16px;
  padding-top:2px;
}
.ex-b{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;letter-spacing:-.005em}
.ex-dose{
  font-family:var(--mono);
  font-size:12px;
  color:var(--load);
  margin-top:2px;
  letter-spacing:.01em;
}
.ex.hsr .ex-dose{color:var(--tendon)}
.ex-car{color:var(--ash-dim);font-size:11px;transition:transform .2s}
.ex.open .ex-car{transform:rotate(90deg)}
.ex-d{display:none;padding:0 14px 14px;border-top:1px solid var(--line-soft)}
.ex.open .ex-d{display:block}

.spec{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:12px 0 11px;
}
.spec div{
  background:var(--ink);
  border:1px solid var(--line-soft);
  border-radius:6px;
  padding:6px 8px;
}
.spec .k{
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
}
.spec .v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:2px;white-space:nowrap}
.why{font-size:12.5px;color:var(--ash);line-height:1.5}
.why b{color:#c9ccd4;font-weight:600}

.sets{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.sets .lbl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
  margin-right:2px;
}
.tick{
  width:30px;height:30px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--ink);
  color:var(--ash-dim);
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
  transition:all .12s;
}
.tick.done{background:var(--load);border-color:var(--load);color:#000;font-weight:700}
.ex.hsr .tick.done{background:var(--tendon);border-color:var(--tendon)}

/* ---------- tools ---------- */
.tool{
  background:var(--slab);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:15px;
  margin-bottom:10px;
}
.tool-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tool-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.tool-hint{font-size:11px;color:var(--ash-dim)}
.readout{
  font-family:var(--mono);
  font-size:42px;
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.phase{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-top:6px;
  color:var(--ash);
}
.bar{height:4px;background:var(--ink);border-radius:2px;margin:13px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--load);border-radius:2px}
.bar i.aero{background:var(--aero)}
.bar i.tendon{background:var(--tendon)}
.btns{display:flex;gap:7px}
button.b{
  flex:1;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--slab-hi);
  color:var(--bone);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button.b:active{transform:scale(.97)}
button.b.go{background:var(--load);border-color:var(--load);color:#000;font-weight:700}
button.b.go.aero{background:var(--aero);border-color:var(--aero)}
button.b.go.tendon{background:var(--tendon);border-color:var(--tendon)}

/* tempo pacer */
.pacer{height:52px;background:var(--ink);border-radius:8px;position:relative;overflow:hidden;margin-bottom:12px;border:1px solid var(--line-soft)}
.pacer i{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--tendon);box-shadow:0 0 12px var(--tendon)}
.pacer span{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);
}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.tbl th{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ash-dim);
  text-align:left;
  padding:7px 8px;
  border-bottom:1px solid var(--line);
  font-weight:500;
}
.tbl td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl td.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}

/* volume bars */
.vol{margin-bottom:9px}
.vol-t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.vol-t span:last-child{font-family:var(--mono);color:var(--ash);font-size:11.5px}
.vol-b{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--line-soft)}
.vol-b i{display:block;height:100%;border-radius:3px;background:var(--ash-dim)}
.vol-b i.pri{background:var(--load)}
.vol-b i.reh{background:var(--tendon)}
.vol-b u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line);text-decoration:none}

/* verdict pills */
.vd{
  display:inline-block;
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.08em;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap;
  text-transform:uppercase;
}
.vd.s{background:#123021;color:var(--ok)}
.vd.p{background:var(--load-bg);color:var(--load)}
.vd.c{background:var(--halt-bg);color:var(--halt)}
.vd.u{background:var(--tendon-bg);color:var(--tendon)}

/* knee log */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:12px 0}
.scale button{
  aspect-ratio:1;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--ink);
  color:var(--ash);
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
}
.scale button.on{background:var(--bone);color:#000;border-color:var(--bone);font-weight:700}
.scale button.hi{border-color:var(--halt);color:var(--halt)}
.scale button.hi.on{background:var(--halt);color:#000;border-color:var(--halt)}
.verdict{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.03em;
  padding:11px 13px;
  border-radius:8px;
  margin-top:11px;
  line-height:1.5;
}
.verdict.go{background:#12291d;color:var(--ok);border:1px solid #1e4030}
.verdict.hold{background:var(--load-bg);color:var(--load);border:1px solid #4a3413}
.verdict.drop{background:var(--halt-bg);color:var(--halt);border:1px solid #4a1f1f}

/* citations */
.cite{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ash-dim);
  line-height:1.6;
  padding:9px 0;
  border-bottom:1px solid var(--line-soft);
}
.cite b{color:var(--ash);font-weight:500}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(14,17,22,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
nav button{
  flex:1;min-width:0;
  background:none;
  border:none;
  padding:11px 2px 12px;
  color:var(--ash-dim);
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  border-top:2px solid transparent;
  margin-top:-1px;
}
nav button.on{color:var(--bone);border-top-color:var(--load)}
nav button .ic{display:block;font-size:15px;margin-bottom:3px;line-height:1}

.foot{
  font-size:11px;
  color:var(--ash-dim);
  line-height:1.6;
  padding:24px 0 10px;
  border-top:1px solid var(--line-soft);
  margin-top:28px;
}


/* ---------- today / landing ---------- */
.hero{
  border:1px solid var(--line);border-radius:14px;padding:17px 16px;margin-bottom:11px;
  background:linear-gradient(150deg,#1d1508 0%,var(--slab) 62%);
}
.hero.aero{background:linear-gradient(150deg,#08222a 0%,var(--slab) 62%)}
.hero.rest{background:linear-gradient(150deg,#191d25 0%,var(--slab) 62%)}
.hero-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--load)}
.hero.aero .hero-lbl{color:var(--aero)}
.hero.rest .hero-lbl{color:var(--ash-dim)}
.hero h2.hn{font-size:27px;font-weight:800;letter-spacing:-.025em;margin:4px 0 3px;padding:0;border:none;color:var(--bone);text-transform:none;font-family:var(--sans)}
.hero .hs{font-size:13px;color:var(--ash);margin-bottom:13px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.hero-stats div{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:8px 9px}
.hero-stats .k{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim)}
.hero-stats .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:2px}

.ring{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.ring svg{flex:0 0 auto;transform:rotate(-90deg)}
.ring .rt{font-family:var(--mono);font-size:12px;color:var(--ash);line-height:1.5}
.ring .rt b{color:var(--bone);font-size:14px}

.check{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;-webkit-tap-highlight-color:transparent}
.check:last-child{border-bottom:none}
.check .box{
  flex:0 0 20px;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);
  background:var(--ink);margin-top:1px;font-family:var(--mono);font-size:11px;
  display:flex;align-items:center;justify-content:center;color:transparent;
}
.check.on .box{background:var(--load);border-color:var(--load);color:#000}
.check .ct2{font-size:13.5px;line-height:1.45}
.check.on .ct2{color:var(--ash-dim);text-decoration:line-through}
.check .cw{font-size:11.5px;color:var(--ash-dim);margin-top:2px;display:block}
.check.on .cw{text-decoration:none}

/* ---------- do / don't ---------- */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 4px}
@media (max-width:400px){.dd{grid-template-columns:1fr;gap:11px}}
.dd h5{
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  margin-bottom:6px;font-weight:700;
}
.dd .do h5{color:var(--ok)}
.dd .dont h5{color:var(--halt)}
.dd .it{font-size:12px;color:#b6bac3;padding:4px 0 4px 15px;position:relative;line-height:1.45}
.dd .do .it::before{content:"✓";position:absolute;left:0;top:4px;color:var(--ok);font-size:10px;font-weight:700}
.dd .dont .it::before{content:"✕";position:absolute;left:0;top:4px;color:var(--halt);font-size:10px;font-weight:700}

/* ---------- pills + video ---------- */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 2px}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  padding:3px 7px;border-radius:5px;background:var(--ink);border:1px solid var(--line);color:var(--ash);
}
.pill.hl{border-color:var(--tendon);color:var(--tendon)}
a.vid{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:10px;margin-top:11px;border-radius:8px;
  background:#2a1214;border:1px solid #55242a;color:#e88;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
a.vid:active{opacity:.75}
a.vid.sm{padding:8px;font-size:10px;margin-top:9px}

/* ---------- load log ---------- */
.log{display:flex;gap:7px;align-items:center;margin-top:11px}
.log input{
  flex:1;background:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:9px 10px;color:var(--bone);font-family:var(--mono);font-size:12.5px;
}
.log input::placeholder{color:var(--ash-dim)}
.log input:focus{outline:none;border-color:var(--load)}
.log .lg{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim);white-space:nowrap}

/* ---------- HR calculator ---------- */
.hrbox{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px}
.hrbig{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hrsub{font-size:12px;color:var(--ash);margin-top:5px}
.hrin{display:flex;gap:8px;align-items:center;margin-top:12px}
.hrin input{
  width:76px;background:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:8px;color:var(--bone);font-family:var(--mono);font-size:14px;text-align:center;
}
.hrin label{font-size:11.5px;color:var(--ash-dim);line-height:1.35}

/* ---------- week strip on other pages ---------- */
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.mini div{
  border-radius:6px;padding:7px 2px;text-align:center;border:1px solid var(--line);
  font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--ash-dim);cursor:pointer;
}
.mini div.l{background:var(--load-bg);border-color:#4a3413;color:var(--load)}
.mini div.a{background:var(--aero-bg);border-color:#123540;color:var(--aero)}
.mini div.now{outline:1px solid var(--bone);outline-offset:1px}

/* ---------- week/phase selector ---------- */
.wksel{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.wksel button{
  flex:0 0 auto;width:34px;height:34px;border-radius:7px;border:1px solid var(--line);
  background:var(--slab);color:var(--ash);font-family:var(--mono);font-size:11px;cursor:pointer;
}
.wksel button.on{background:var(--bone);color:#000;border-color:var(--bone);font-weight:700}
.wksel button.dl{border-color:var(--aero);color:var(--aero)}
.wksel button.dl.on{background:var(--aero);color:#000}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:360px){
  .chip .ct{font-size:10.5px}
  .chip .cs{display:none}
  .col{grid-template-rows:46px 18px 46px}
}

  async set(k,v){
    mem[k]=v;

/* ============================================================
   VOLUME — computed from the sessions above, not asserted
   ============================================================ */
function volume(){
  const tot={}, freq={};
  Object.entries(S).forEach(([k,ses])=>{
    const seen=new Set();
    ses.ex.forEach(e=>{
      (e.m||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n; seen.add(mu); });
      (e.i||[]).forEach(([mu,n])=>{ tot[mu]=(tot[mu]||0)+n*0.5; seen.add(mu); });
    });
    seen.forEach(mu=>freq[mu]=(freq[mu]||0)+1);
  });
  return Object.entries(tot)
    .map(([mu,v])=>({mu, v:Math.round(v*10)/10, f:freq[mu]}))
    .sort((a,b)=>b.v-a.v);
}

/* HSR tier for the current block week — shown on tendon movements */
function hsrTier(w){
  if(w<=3) return "~15RM";
  if(w<=5) return "~12RM";
  if(w===6) return "~10RM";
  if(w===7) return "deload · hold load, 2 sets";
  if(w<=10) return "~8RM";
  return "~6RM";
}
function rirTarget(w){
  if(w<=3) return "2–3"; if(w<=6) return "1–3"; if(w===7) return "3–4"; return "1–2";
}
function phaseName(w){
  if(w<=3) return "Accumulation"; if(w<=6) return "Progression"; if(w===7) return "Deload";
  if(w<=10) return "Intensification"; return "Peak";
}

async function tick(id,s,el){
  const a = state.ticks[id]||[];
  const idx = a.indexOf(s);
  if(idx>=0) a.splice(idx,1); else a.push(s);
  state.ticks[id]=a;
  el.classList.toggle("done");
  await store.set("ticks",state.ticks);
}
async function logLoad(id,v){
  state.loads = state.loads||{};
  state.loads[id]=v;
  await store.set("loads",state.loads);
}

/* session completion, used by Today */
function progress(key){
  const s = S[key]; if(!s) return null;
  let total=0, done=0;
  s.ex.forEach((e,i)=>{ if(e.opt) return; total+=e.sets; done+=((state.ticks[key+"-"+i]||[]).length); });
  return {total, done, pct: total? Math.round(done/total*100):0};
}
async function resetSession(key){
  const s=S[key]; if(!s) return;
  s.ex.forEach((e,i)=>{ delete state.ticks[key+"-"+i]; });
  await store.set("ticks",state.ticks);
  renderTrain();
}

function intervalTool(){return `<div class="tool">

function restTool(){return `<div class="tool">
  <div class="tool-top"><span class="tool-name">Rest timer</span><span class="tool-hint">tap to set</span></div>
  <div class="readout" id="rsR">3:00</div><div class="phase" id="rsP">ready</div>
  <div class="bar"><i id="rsB"></i></div>

    <button class="b" onclick="setRest(300)">5 min</button>
  </div>
  <div class="btns"><button class="b go" id="rsgo" onclick="toggleTimer('rs')">Start</button><button class="b" onclick="resetTimer('rs')">Reset</button></div></div>`;}

const IV_PHASES = [["Warm-up",600],["Interval 1",240],["Recovery",180],["Interval 2",240],["Recovery",180],["Interval 3",240],["Recovery",180],["Interval 4",240],["Cool-down",300]];
const HD_PHASES = [["Hold 1",45],["Rest",120],["Hold 2",45],["Rest",120],["Hold 3",45],["Rest",120],["Hold 4",45],["Rest",120],["Hold 5",45]];
const T = {
  iv:{ph:IV_PHASES,i:0,left:600,on:false,r:"ivR",p:"ivP",b:"ivB",g:"ivgo"},
  hd:{ph:HD_PHASES,i:0,left:45,on:false,r:"hdR",p:"hdP",b:"hdB",g:"hdgo"},
  rs:{ph:[["Rest",180]],i:0,left:180,on:false,r:"rsR",p:"rsP",b:"rsB",g:"rsgo"}
};
function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return m>0?m+":"+String(x).padStart(2,"0"):String(x);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function paint(k){
  const t=T[k], r=document.getElementById(t.r); if(!r) return;
  const [nm,dur]=t.ph[t.i];
  r.textContent=fmt(Math.ceil(t.left));
  const total=t.ph.length;
  document.getElementById(t.p).textContent = k==="hd"
    ? `${nm} · ${Math.floor(t.i/2)+1} of 5`
    : (total>1 ? `${nm} · ${t.i+1} of ${total}` : nm);
  document.getElementById(t.b).style.width = ((dur-t.left)/dur*100)+"%";
  const g=document.getElementById(t.g); if(g) g.textContent = t.on?"Pause":"Start";
}
function toggleTimer(k){ T[k].on=!T[k].on; paint(k); }
function resetTimer(k){ const t=T[k]; t.on=false; t.i=0; t.left=t.ph[0][1]; paint(k); }
function setRest(s){ T.rs.ph=[["Rest",s]]; resetTimer("rs"); }
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  Object.keys(T).forEach(k=>{
    const t=T[k]; if(!t.on) return;
    if(!document.getElementById(t.r)) return;
    t.left-=dt;
    if(t.left<=0){
      if(t.i<t.ph.length-1){ t.i++; t.left=t.ph[t.i][1]; buzz([90,60,90]); }
      else { t.on=false; t.left=0; buzz([200,80,200,80,200]); }
    }
    paint(k);
  });
  // tempo pacer
  if(PC.on){
    PC.t+=dt; const cyc=PC.t%6, up=cyc<3;
    const bar=document.getElementById("pcb"), lab=document.getElementById("pct");
    if(bar){
      bar.style.left = (up? cyc/3 : (1-(cyc-3)/3))*98 + "%";
      lab.textContent = (up?"UP  ":"DOWN  ") + (up?Math.ceil(3-cyc):Math.ceil(3-(cyc-3)));
      if(Math.floor(PC.t/3)!==PC.half){ PC.half=Math.floor(PC.t/3); buzz(35); }
    }
  }
  requestAnimationFrame(loop);
}
const PC={on:false,t:0,half:-1};
function togglePacer(){
  PC.on=!PC.on; if(PC.on){PC.t=0;PC.half=-1;}
  const g=document.getElementById("pcgo"); if(g) g.textContent=PC.on?"Stop":"Start";
  if(!PC.on){const l=document.getElementById("pct"); if(l) l.textContent="Ready";}
}
requestAnimationFrame(loop);

    <tr><td class="m" style="color:var(--halt)">−</td><td>The standalone Saturday half day. Content redistributed; no muscle lost frequency.</td></tr>
    <tr><td class="m" style="color:var(--halt)">−</td><td>Pre-exhaustion and activation supersets — no proven benefit when activation is already good.</td></tr>
    <tr><td class="m" style="color:var(--halt)">−</td><td>Redundant overlapping isolation angles.</td></tr>
    <tr><td class="m" style="color:var(--halt)">−</td><td>Early ballistic knee loading — now gated behind three criteria.</td></tr>
    <tr><td class="m" style="color:var(--halt)">−</td><td>The fabricated sleep-adaptation percentage.</td></tr>
    <tr><td class="m" style="color:var(--halt)">−</td><td>Any "TRT justifies daily muscle hits" reasoning.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Full lifting/conditioning separation, with the stronger male lower-body-strength justification.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Zone 2 reframed around recovery cost; 4×4 promoted to default.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Diagnosis gate before week 1.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Left knee: lead-with-left instead of extra heavy load.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Energy availability, previously absent.</td></tr>
    <tr><td class="m" style="color:var(--ok)">+</td><td>Live volume computation, so the redistribution is verifiable rather than claimed.</td></tr>
  </table></div>
  <p class="small"><strong>Preserved from v1 because it was already well-founded:</strong> twice-weekly frequency, stretch-position exercise selection, removal of activation and pre-exhaust drills, gastroc/soleus differentiation, Spanish-squat dosing, HSR as the tendon core, and collagen + vitamin C timing.</p>

  <h2>Sources</h2>
  ${CITES.map(c=>`<div class="cite">${c}</div>`).join("")}`;
}

/* ============================================================
   HEART RATE — computed, not hard-coded
   ============================================================ */
function hrmax(){ return state.hrmax || (220 - (state.age||39)); }
function hrBox(kind){
  const m = hrmax();
  const z2 = [Math.round(m*.60), Math.round(m*.70)];
  const hi = [Math.round(m*.90), Math.round(m*.95)];
  const rec = Math.round(m*.70);
  return `<div class="hrbox">
    <div class="tool-name" style="margin-bottom:8px">${kind==='z2'?'Your Zone 2 window':'Your interval targets'}</div>
    ${kind==='z2'
      ? `<div class="hrbig" style="color:var(--aero)">${z2[0]}–${z2[1]} bpm</div>
         <div class="hrsub">60–70% of an estimated max of ${m}. If you drift above this, the day stops being cheap.</div>`
      : `<div class="hrbig" style="color:var(--aero)">${hi[0]}–${hi[1]} bpm</div>
         <div class="hrsub">Work intervals at 90–95% of an estimated max of ${m}. Recovery blocks at about ${rec} bpm.</div>`}
    <div class="hrin">
      <input type="number" value="${state.age||39}" min="18" max="90" onchange="setAge(this.value)">
      <label>Age — used for the 220−age estimate. A measured max from a ramp test is more accurate; enter it below if you have one.</label>
    </div>
    <div class="hrin">
      <input type="number" value="${state.hrmax||''}" placeholder="—" min="120" max="220" onchange="setHrmax(this.value)">
      <label>Measured HRmax, if you know it. Overrides the estimate.</label>
    </div>
  </div>`;
}
async function setAge(v){ state.age=+v||39; await store.set("age",state.age); renderTrain(); }
async function setHrmax(v){ state.hrmax = v?+v:null; await store.set("hrmax",state.hrmax); renderTrain(); }

/* ============================================================
   TODAY — the daily driver
   ============================================================ */
const DAILY = {
  lift:[
   ["Warm up properly","5 min easy cardio → 5 min mobility with ankle work → ramp sets on the first compound"],
   ["Set your RIR for the week","Target {rir} today — the prescription is a target, not a contract"],
   ["Log your loads","Double progression only works if you know what you did last time"]
  ],
  lower:[
   ["Collagen + vitamin C","15 g with ~50 mg vitamin C, 30–60 min before you start — this is a tendon day"],
   ["Warm up properly","5 min easy cardio → mobility with weighted ankle dorsiflexion → ramp sets"],
   ["HSR tempo is {tier} at 3 s / 3 s","If the tempo breaks, the set ended two reps ago"],
   ["Lead with the left","On every unilateral movement, left first, then match the reps on the right"],
   ["Log tomorrow's knee score","Single-leg decline squat, first thing in the morning"]
  ],
  z2:[
   ["Keep it conversational","Full sentences without gasping. Short phrases means you have gone too hard"],
   ["45–60 minutes, knee-friendly","Bike, row, incline walk. No running while the tendon is symptomatic"],
   ["This is a recovery day with a training label","Its job is cheap aerobic volume, not a mitochondrial peak"]
  ],
  vo2:[
   ["Check your resting heart rate","Up 7 bpm or more on baseline? Swap to Zone 2 today"],
   ["Confirm you are cleared","Maximal-HR intervals need explicit physician sign-off on TRT"],
   ["Pace the first interval easy","If interval four is survival, the first two were too hard"],
   ["Bike, row or incline — not running","Same cardiac stimulus, a fraction of the tendon load"]
  ],
  rest:[
   ["Sleep 7–9 hours","The single biggest lever in this programme, and the one you control tonight"],
   ["Hit your protein","1.6–2.2 g/kg across 3–5 feedings — do not skip it because you did not train"],
   ["Actually rest","No 'light' session. The rest day is positioned to set up Monday's tendon work"]
  ]
};
const ALWAYS = [
  ["Sleep 7–9 h, consistent timing","Biggest recovery lever. No fabricated percentage needed."],
  ["Protein 1.6–2.2 g/kg","Across 3–5 feedings. Upper end while running four lifting days."],
  ["Creatine 5 g","Any time of day. The most reliable supplement you take."],
  ["Eat enough","Tendon repair, hypertrophy and six training days cannot be funded from a deficit."],
  ["Respect the 24-hour rule","≤3/10 during, settled within 24 h. It outranks the progression table."]
];

function todayKey(){ return new Date().toISOString().slice(0,10); }
async function checkOff(idx,el){
  const k = todayKey();
  state.daily = state.daily||{};
  state.daily[k] = state.daily[k]||[];
  const a = state.daily[k], i = a.indexOf(idx);
  if(i>=0) a.splice(i,1); else a.push(idx);
  el.classList.toggle("on");
  await store.set("daily",state.daily);
}

function renderToday(){
  const dow = new Date().getDay();
  const idx = dow===0?6:dow-1;
  const d = WEEK[idx];
  const nxt = WEEK[(idx+1)%7];
  const lift = !!S[d.key];
  const ses = S[d.key]||COND[d.key];
  const pr = lift?progress(d.key):null;
  const w = state.week;

  let list;
  if(d.key==="rest") list=DAILY.rest;
  else if(d.key==="zone2") list=DAILY.z2;
  else if(d.key==="vo2") list=DAILY.vo2;
  else if(d.key.startsWith("lower")) list=DAILY.lower;
  else list=DAILY.lift;
  list = list.map(x=>[x[0].replace("{rir}",rirTarget(w)).replace("{tier}",hsrTier(w)), x[1]]);
  const dchecks = (state.daily&&state.daily[todayKey()])||[];

  const kneeLast = state.knee.length?state.knee[state.knee.length-1]:null;
  const kneeToday = kneeLast && kneeLast.d===todayKey();

  const R=26, C=2*Math.PI*R;
  const heroCls = d.key==="rest"?"rest":(lift?"":"aero");
  const accent = d.key==="rest"?"var(--ash-dim)":(lift?"var(--load)":"var(--aero)");

  $("#v-today").innerHTML = `
  <div class="hero ${heroCls}">
    <div class="hero-lbl">${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][idx]} · Week ${w} · ${phaseName(w)}</div>
    <h2 class="hn">${d.full}</h2>
    <div class="hs">${ses?ses.tag:"Complete rest. Nothing today — that is the prescription."}</div>
    ${lift?`
      <div class="ring">
        <svg width="60" height="60"><circle cx="30" cy="30" r="${R}" fill="none" stroke="#2a323f" stroke-width="5"/>
        <circle cx="30" cy="30" r="${R}" fill="none" stroke="${accent}" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pr.pct/100)}"/></svg>
        <div class="rt"><b>${pr.done} of ${pr.total} sets</b><br>${pr.pct}% complete${pr.pct===100?" — done for today":""}</div>
      </div>`:""}
    <div class="hero-stats">
      ${lift?`
        <div><div class="k">Sets</div><div class="v">${pr.total}</div></div>
        <div><div class="k">RIR</div><div class="v">${rirTarget(w)}</div></div>
        <div><div class="k">${d.tendon?"HSR":"Est."}</div><div class="v" style="font-size:${d.tendon?'11px':'15px'}">${d.tendon?hsrTier(w):"~75 min"}</div></div>`
      : d.key==="rest"?`
        <div><div class="k">Sleep</div><div class="v">7–9 h</div></div>
        <div><div class="k">Protein</div><div class="v">1.6–2.2</div></div>
        <div><div class="k">Training</div><div class="v">None</div></div>`
      :`
        <div><div class="k">Time</div><div class="v">${d.key==="vo2"?"~38 m":"45–60 m"}</div></div>
        <div><div class="k">Target</div><div class="v">${d.key==="vo2"?Math.round(hrmax()*.90)+"+":Math.round(hrmax()*.60)+"–"+Math.round(hrmax()*.70)}</div></div>
        <div><div class="k">Impact</div><div class="v">Low</div></div>`}
    </div>
    ${d.key!=="rest"?`<button class="b go ${lift?'':'aero'}" style="width:100%" onclick="goSession('${d.key}')">${pr&&pr.done>0?'Continue':'Start'} ${d.full} →</button>`:""}
  </div>

  ${w===7?`<div class="note aero"><div class="nt">Deload week</div><p>Volume cut roughly in half, RIR 3–4, load and movement patterns kept. Zone 2 continues; skip the 4×4. This deload is tendon insurance, not a hypertrophy strategy — connective tissue adapts slower than muscle.</p></div>`:""}

  <h2>Today's checklist</h2>
  <div class="card" style="padding:4px 15px">
    ${list.map((c,i)=>`<div class="check ${dchecks.includes(i)?'on':''}" onclick="checkOff(${i},this)">
      <span class="box">✓</span><span><span class="ct2">${c[0]}</span><span class="cw">${c[1]}</span></span></div>`).join("")}
  </div>

  ${d.tendon||d.key==="rest"?`
  <h2>Knee — morning score</h2>
  <div class="card">
    <p class="small" style="margin-bottom:2px">Single-leg decline squat, 25° board, same time each morning after a lower day.</p>
    <div class="scale">${Array.from({length:11},(_,i)=>`<button class="${i>3?'hi':''} ${kneeToday&&kneeLast.v===i?'on':''}" onclick="logKnee(${i});setView('today')">${i}</button>`).join("")}</div>
    ${kneeToday?`<div class="verdict ${kneeLast.v>3?'drop':kneeLast.v>2?'hold':'go'}">${
      kneeLast.v>3?"Above 3/10. Drop the tendon load one tier at the next session. Do not push through."
      :kneeLast.v>2?"Borderline. Hold the current tier rather than advancing."
      :"Inside tolerance. Progress as scheduled."}</div>`
      :`<p class="small" style="margin:8px 0 0;color:var(--ash-dim)">Not logged today.</p>`}
    <a class="vid sm" href="${yt('single leg decline squat test patellar tendinopathy')}" target="_blank" rel="noopener">▶ How to perform the decline squat test</a>
  </div>`:""}

  <h2>Every day, regardless</h2>
  <div class="card" style="padding:4px 15px">
    ${ALWAYS.map((c,i)=>`<div class="check ${dchecks.includes(100+i)?'on':''}" onclick="checkOff(${100+i},this)">
      <span class="box">✓</span><span><span class="ct2">${c[0]}</span><span class="cw">${c[1]}</span></span></div>`).join("")}
  </div>

  <h2>Block week</h2>
  <div class="wksel">${Array.from({length:12},(_,i)=>`<button class="${i+1===7?'dl':''} ${i+1===w?'on':''}" onclick="setWeek(${i+1})">${i+1}</button>`).join("")}</div>
  <div class="card"><table class="tbl">
    <tr><td class="m" style="color:var(--load)">Phase</td><td>${phaseName(w)}</td></tr>
    <tr><td class="m" style="color:var(--load)">RIR</td><td>${rirTarget(w)}</td></tr>
    <tr><td class="m" style="color:var(--tendon)">HSR tier</td><td>${hsrTier(w)} at 3 s / 3 s — advance only after two clean sessions under the 24-hour rule</td></tr>
  </table></div>

  <h2>The rest of the week</h2>
  <div class="mini">${WEEK.map((x,i)=>`<div class="${x.lane==='top'?'l':x.lane==='bot'?'a':''} ${i===idx?'now':''}" onclick="selDay=${i};setView('week')">${x.d}<br>${x.t}</div>`).join("")}</div>
  <p class="small">Next up — <strong>${nxt.full}</strong>. ${nxt.why}</p>`;
}
async function setWeek(w){ state.week=w; await store.set("week",w); renderToday(); }

/* ============================================================
   INIT
   ============================================================ */
function setView(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  $("#v-"+v).classList.add("on");
  ({today:renderToday, week:renderWeek, train:renderTrain, knee:renderKnee, plan:renderPlan, eviq:renderEvid})[v]();
  window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));

$("#foot").innerHTML = `Verified August 2026 against PubMed, publisher pages and the papers themselves.
  Medical supervision required for TRT management, maximal-HR intervals and tendon progression.
  Physiotherapist oversight required for the tendinopathy, including confirming the diagnosis.
  This is a training document, not medical advice.`;

(async function(){
  const t = await store.get("ticks");  if(t) state.ticks = t;
  const k = await store.get("knee");   if(k) state.knee = k;
  const l = await store.get("loads");  if(l) state.loads = l;
  const dd = await store.get("daily"); if(dd) state.daily = dd;
  const a = await store.get("age");    if(a) state.age = a;
  const hm = await store.get("hrmax"); if(hm) state.hrmax = hm;
  const w = await store.get("week");   if(w) state.week = w;
  const today = new Date().getDay();          // 0 = Sun
  selDay = today === 0 ? 6 : today - 1;
  curSession = WEEK[selDay].key === "rest" ? "lowerA" : WEEK[selDay].key;
  renderToday();
})();
</script>
